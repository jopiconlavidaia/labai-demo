/* ════════════════ ANÁLISIS IA ════════════════ */
function simulateAnalysis(doc) {
  const base = {
    'Dermatopatología':{ tipo:'Informe dermatopatológico', diag:'Melanoma maligno (Breslow 1,2 mm)', riesgo:'Alto' },
    'Patología mamaria':{ tipo:'Biopsia mamaria (BAG)', diag:'Carcinoma ductal infiltrante, grado 2', riesgo:'Alto' },
    'Ginecológica':{ tipo:'Citología cervical', diag:'Lesión intraepitelial de bajo grado (LSIL)', riesgo:'Medio' },
    'Digestiva':{ tipo:'Biopsia de colon', diag:'Adenoma tubular con displasia de bajo grado', riesgo:'Bajo' },
  };
  return base[doc.spec] || base['Digestiva'];
}
const ANZ_DOCS = INITIAL_SAMPLES.filter(s=>s.state==='validado' || s.urgent).slice(0,5);

function Analyze() {
  const [docId, setDocId] = useState(ANZ_DOCS[0]?.id);
  const doc = ANZ_DOCS.find(d=>d.id===docId) || ANZ_DOCS[0];
  const [result, setResult] = useState(null);
  const [busy, setBusy] = useState(false);

  const analyze = async () => {
    setBusy(true); setResult(null);
    await sleep(900 + Math.random()*700);
    const a = simulateAnalysis(doc);
    setResult({
      partes:[doc.patient + ` (${doc.age} años)`, doc.ref],
      fecha: doc.received,
      tipoDoc: a.tipo,
      diagnostico: a.diag,
      riesgo: a.riesgo,
      snomed: snomedFor(doc.spec),
      claves:['Confirmar márgenes de resección','Valorar técnicas complementarias (IHQ)','Correlación clínica recomendada'],
    });
    setBusy(false);
  };

  const riskColor = (r)=> r==='Alto' ? ['var(--red-bg)','var(--red)'] : r==='Medio' ? ['var(--amber-bg)','var(--amber)'] : ['var(--green-bg)','var(--green)'];

  return (
    <div>
      <div className="page-head">
        <div><h1>Análisis IA de documentos</h1><p>Extracción estructurada automática de datos clave de cualquier documento del laboratorio</p></div>
      </div>
      <div className="anz-grid">
        <div className="card" style={{height:'fit-content'}}>
          <div className="card-head"><h3>{I.analyze} Documento a analizar</h3></div>
          <div style={{padding:'10px'}}>
            {ANZ_DOCS.map(d=>(
              <button key={d.id} className={`doc-item${docId===d.id?' active':''}`} disabled={busy} onClick={()=>{setDocId(d.id); setResult(null);}}>
                <div className="doc-item-top"><span>{I.doc}</span><span className="doc-item-name">{d.id}</span></div>
                <div className="doc-item-meta">{d.type.slice(0,38)}</div>
              </button>
            ))}
            <button className="btn btn-primary" style={{width:'100%',marginTop:10}} onClick={analyze} disabled={busy}>
              {busy ? <><span className="spinner"></span> Analizando…</> : <>{I.ai} Analizar con IA</>}
            </button>
            {/* Esta extracción siempre es simulada en la demo (no llama a ningún motor de IA real). */}
            <p style={{fontSize:11,color:'var(--text-3)',marginTop:9,textAlign:'center'}}>● Modo demostración</p>
          </div>
        </div>

        <div className="card">
          <div className="card-head"><h3>📋 Datos extraídos</h3>{result && <div className="card-actions"><span className="audit-tag" style={{background:'var(--green-bg)',color:'var(--green)'}}>✓ Análisis completado</span></div>}</div>
          {!result ? (
            <div className="empty"><div className="empty-ico">{I.analyze}</div><h3>{busy?'Analizando documento…':'Sin análisis todavía'}</h3><p>{busy?'La IA está extrayendo los datos clave.':'Selecciona un documento y pulsa «Analizar con IA» para extraer automáticamente sus datos.'}</p></div>
          ) : (
            <div>
              <div className="anz-field"><div className="anz-k">Tipo de documento</div><div className="anz-v">{result.tipoDoc}</div></div>
              <div className="anz-field"><div className="anz-k">Partes / identificación</div><div className="anz-v">{result.partes.join(' · ')}</div></div>
              <div className="anz-field"><div className="anz-k">Fecha</div><div className="anz-v">{result.fecha}</div></div>
              <div className="anz-field"><div className="anz-k">Diagnóstico detectado</div><div className="anz-v"><strong>{result.diagnostico}</strong></div></div>
              <div className="anz-field"><div className="anz-k">Nivel de riesgo</div><div className="anz-v"><span className="anz-tag" style={{background:riskColor(result.riesgo)[0],color:riskColor(result.riesgo)[1]}}>{result.riesgo}</span></div></div>
              <div className="anz-field"><div className="anz-k">Codificación SNOMED CT</div><div className="anz-v"><span className="snomed-code">{result.snomed.code}</span> · {result.snomed.t}<br/><span style={{color:'var(--text-3)',fontSize:12.5}}>{result.snomed.topo}</span></div></div>
              <div className="anz-field"><div className="anz-k">Puntos clave / recomendaciones</div><div className="anz-v">{result.claves.map((c,i)=><div key={i} style={{display:'flex',gap:8,padding:'2px 0'}}><span style={{color:'var(--brand-500)'}}>→</span>{c}</div>)}</div></div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ════════════════ CLIENTES Y TARIFAS ════════════════ */
function Clients({ samples, clients, addClient, updateClient, deleteClient, onOpenSamples, adminDocs=[], onOpenAdmin }) {
  const { t } = useT();
  const [modal, setModal] = useState(null); // null | 'new' | client object a editar

  const rows = clients.map(c => {
    const list = samples.filter(s => s.client === c.id);
    const byType = { B:0, C:0, P:0, G:0 };
    list.forEach(s => { byType[s.tipo] = (byType[s.tipo]||0) + 1; });
    const docs = adminDocs.filter(d => d.clientId === c.id);
    const docPending = docs.filter(d => ['borrador','enviada','pendiente'].includes(d.status)).length;
    return { ...c, count:list.length, byType, docCount:docs.length, docPending };
  }).sort((a,b)=>b.count-a.count);

  const totalMuestras = rows.reduce((a,b)=>a+b.count,0);
  const activos = rows.filter(r=>r.count>0).length;
  const avgDto = rows.length ? Math.round(rows.reduce((a,b)=>a+b.discount,0)/rows.length) : 0;
  const stats = [
    { label:t('clients.statTotal'), num:clients.length },
    { label:t('clients.statActive'), num:activos },
    { label:t('clients.statLinked'),  num:totalMuestras },
    { label:t('clients.statDiscount'), num:avgDto+'%' },
  ];

  const remove = (c) => {
    if (window.confirm(`¿Eliminar «${c.name}» de la lista de clientes?`)) deleteClient(c.id);
  };

  return (
    <div>
      <div className="page-head">
        <div>
          <h1>{t('clients.title')}</h1>
          <p>{t('clients.subtitle')}</p>
        </div>
        <div className="page-head-actions">
          <button className="btn btn-primary" onClick={()=>setModal('new')}>{I.plus} {t('clients.new')}</button>
        </div>
      </div>

      <div className="mini-stat-row">
        {stats.map((s,i)=>(
          <div className="mini-stat" key={i}>
            <div className="ms-num">{s.num}</div>
            <div className="ms-label">{s.label}</div>
          </div>
        ))}
      </div>

      {rows.length===0 && (
        <div className="card"><div className="empty"><div className="empty-ico">{GL.building}</div><h3>{t('clients.emptyTitle')}</h3><p>{t('clients.emptyDesc')}</p></div></div>
      )}

      <div className="client-grid">
        {rows.map(c=>(
          <div className="client-card" key={c.id}>
            <div className="cc-head">
              <span className="cc-ico">{GL.building}</span>
              <div style={{flex:1,minWidth:0}}>
                <div className="cc-name">{c.name}</div>
                <div className="cc-type">{c.type}{c.internalCode ? ` · nº interno ${c.internalCode}` : ''}</div>
              </div>
              <span className={`cc-dto${c.discount===0?' zero':''}`}>{c.discount>0?`−${c.discount}%`:'Sin dto.'}</span>
              <div className="cc-actions">
                <button className="icon-btn-sm" title="Editar cliente" aria-label={`Editar ${c.name}`} onClick={()=>setModal(c)}><Ico d={<><path d="M17 3a2.85 2.83 0 114 4L7.5 20.5 2 22l1.5-5.5z"/></>} size={14}/></button>
                <button className="icon-btn-sm danger" title="Eliminar cliente" aria-label={`Eliminar ${c.name}`} onClick={()=>remove(c)}><Ico d={<><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></>} size={14}/></button>
              </div>
            </div>

            <div className="cc-vol">
              <div><span className="cc-vol-num">{c.count}</span> <span className="cc-vol-lab">muestra{c.count===1?'':'s'} este período</span></div>
              <div className="cc-types">
                {['B','C','P'].map(t=> c.byType[t]>0 && <span key={t} className="cc-type-chip"><span className="cctc-l">{t}</span>{c.byType[t]}</span>)}
                {c.count===0 && <span style={{fontSize:11.5,color:'var(--text-3)'}}>Sin entradas</span>}
              </div>
            </div>

            <div className="cc-rates">
              <div className="cc-rates-head">Tarifa por muestra</div>
              <div className="cc-rate-row">
                {['B','C','P'].map(t=>{
                  const base = c.rate?.[t] ?? 0;
                  const net = Math.round(base*(1-c.discount/100));
                  return (
                    <div className="cc-rate" key={t}>
                      <span className="cc-rate-t">{TIPOS[t].label}</span>
                      <span className="cc-rate-v">{net} €{c.discount>0 && <span className="cc-rate-base">{base} €</span>}</span>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="cc-vol" style={{marginBottom:0,borderBottom:'none'}}>
              <div style={{fontSize:12,color:'var(--text-2)'}}>
                {c.docCount
                  ? <>{GL.tag} <strong>{c.docCount}</strong> {c.docCount!==1?t('clients.docs'):t('clients.doc')} · {c.docPending} {c.docPending!==1?t('clients.docPendingPl'):t('clients.docPendingSg')}</>
                  : <span style={{color:'var(--text-3)'}}>{t('clients.docsNone')}</span>}
              </div>
              <button className="btn btn-ghost btn-sm" onClick={()=>onOpenAdmin && onOpenAdmin({ clientId:c.id, openNew:c.docCount===0 })}>{c.docCount?t('clients.viewDocs'):t('clients.newDoc')}</button>
            </div>
          </div>
        ))}
      </div>

      <div className="card" style={{marginTop:16}}>
        <div className="card-head"><h3>Cómo se aplica</h3></div>
        <div style={{padding:'14px 18px',fontSize:13,color:'var(--text-2)',lineHeight:1.6}}>
          Al registrar una muestra en <button className="link-btn" onClick={onOpenSamples}>Recepción</button> se escribe el cliente
          (o se elige uno existente), y el sistema aplica automáticamente su <strong>descuento</strong> y su <strong>tarifa por tipo de muestra</strong>.
          Aquí puedes dar de alta, editar o eliminar cualquier cliente, con los datos reales del despacho.
          Así dirección puede diferenciar condiciones cliente por cliente para facturación y estadística.
        </div>
      </div>

      {modal && (
        <ClientModal
          client={modal==='new' ? null : modal}
          onClose={()=>setModal(null)}
          onSave={(data)=>{
            if (modal==='new') addClient(data); else updateClient(modal.id, data);
            setModal(null);
          }}
        />
      )}
    </div>
  );
}

const CLIENT_TYPE_SUGGESTIONS = ['Hospital', 'Clínica privada', 'Centro derivador', 'Mútua', 'Aseguradora', 'Particular'];

function ClientModal({ client, onClose, onSave }) {
  const [f, setF] = useState(() => ({
    name: client?.name || '',
    type: client?.type || '',
    discount: client?.discount ?? 0,
    rateB: client?.rate?.B ?? 100,
    rateC: client?.rate?.C ?? 60,
    rateP: client?.rate?.P ?? 75,
    internalCode: client?.internalCode || '',
  }));
  const set = (k,v) => setF(p=>({...p,[k]:v}));
  const valid = f.name.trim().length > 0 && validNumber(f.discount,0,100) && [f.rateB,f.rateC,f.rateP].every(v=>validNumber(v,0,100000000));

  const submit = () => {
    if (!valid) return;
    onSave({
      name: f.name.trim(),
      type: f.type.trim() || 'Cliente',
      discount: Math.max(0, Math.min(100, Number(f.discount)||0)),
      rate: { B: Number(f.rateB)||0, C: Number(f.rateC)||0, P: Number(f.rateP)||0 },
      internalCode: f.internalCode.trim(),
    });
  };

  return (
    <Portal>
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget && onClose()}>
      <div className="modal" style={{width:520}}>
        <div className="modal-head">
          <h3>{I.plus} {client ? 'Editar cliente' : 'Nuevo cliente'}</h3>
          <p>Pon el nombre, el tipo y las condiciones reales que tengáis pactadas con este cliente.</p>
        </div>
        <div className="modal-body">
          <div className="new-sample-grid">
            <div className="field full">
              <label className="field-label">Nombre *</label>
              <input className="field-input" placeholder="p. ej. Hospital de Bellvitge" value={f.name} onChange={e=>set('name',e.target.value)} autoFocus/>
            </div>
            <div className="field full">
              <label className="field-label">Tipo</label>
              <input className="field-input" list="client-type-dl" placeholder="Hospital, clínica privada, mútua…" value={f.type} onChange={e=>set('type',e.target.value)}/>
              <datalist id="client-type-dl">{CLIENT_TYPE_SUGGESTIONS.map(t=><option key={t} value={t}/>)}</datalist>
            </div>
            <div className="field">
              <label className="field-label">Descuento (%)</label>
              <input className="field-input" type="number" min="0" max="100" value={f.discount} onChange={e=>set('discount',e.target.value)}/>
            </div>
            <div className="field">
              <label className="field-label">Nº interno del centro (opcional)</label>
              <input className="field-input" placeholder="p. ej. 6421" value={f.internalCode} onChange={e=>set('internalCode',e.target.value)}/>
            </div>
            <div className="field">
              <label className="field-label">Tarifa Biopsia (€)</label>
              <input className="field-input" type="number" min="0" value={f.rateB} onChange={e=>set('rateB',e.target.value)}/>
            </div>
            <div className="field">
              <label className="field-label">Tarifa Citología (€)</label>
              <input className="field-input" type="number" min="0" value={f.rateC} onChange={e=>set('rateC',e.target.value)}/>
            </div>
            <div className="field full">
              <label className="field-label">Tarifa Punción · PAAF (€)</label>
              <input className="field-input" type="number" min="0" value={f.rateP} onChange={e=>set('rateP',e.target.value)}/>
            </div>
          </div>
        </div>
        <div className="modal-foot">
          <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={submit} disabled={!valid}>{client ? 'Guardar cambios' : 'Crear cliente'}</button>
        </div>
      </div>
    </div>
    </Portal>
  );
}

/* ════════════════ ADMINISTRACIÓN ════════════════
   Ofertas, pedidos, albaranes, facturas y proformas — el "kit básico" de CRM que
   pedía el laboratorio, con enlaces directos desde Muestras y Clientes para no
   tener que volver atrás a buscar el documento a mano. */
function Admin({ adminDocs, addAdminDoc, updateAdminDoc, convertAdminDoc, clients, samples, focus, clearFocus, showToast }) {
  const { t, lang } = useT();
  const [type, setType] = useState('factura');
  const [clientFilter, setClientFilter] = useState('all');
  const [statusFilter, setStatusFilter] = useState('all');
  const [search, setSearch] = useState('');
  const [showNew, setShowNew] = useState(false);
  const [selectedId, setSelectedId] = useState(null);
  const [presetSampleId, setPresetSampleId] = useState(null);
  const [presetSampleIds, setPresetSampleIds] = useState(null);

  useEffect(() => {
    if (!focus) return;
    if (focus.docId) {
      const doc = adminDocs.find(d=>d.id===focus.docId);
      if (doc) { setType(doc.type); setSelectedId(doc.id); setClientFilter('all'); }
    } else if (focus.clientId) {
      setClientFilter(focus.clientId);
      setSelectedId(null);
      // sampleIds (varias muestras seleccionadas a la vez) tiene prioridad sobre
      // sampleId (una sola, desde "Crear factura con esta muestra").
      if (focus.sampleIds && focus.sampleIds.length) { setPresetSampleIds(focus.sampleIds); setPresetSampleId(null); setType('factura'); }
      else if (focus.sampleId) { setPresetSampleId(focus.sampleId); setPresetSampleIds(null); setType('factura'); }
      if (focus.openNew) setShowNew(true);
    }
    clearFocus();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [focus]);

  const q = search.trim().toLowerCase();
  const filtered = adminDocs.filter(d => {
    if (d.type !== type) return false;
    if (clientFilter!=='all' && d.clientId !== clientFilter) return false;
    if (statusFilter!=='all' && d.status !== statusFilter) return false;
    const client = clientById(clients, d.clientId)?.name || '';
    if (q && !(`${d.code} ${client} ${d.notes||''}`.toLowerCase().includes(q))) return false;
    return true;
  });

function DocModal({ type, clients, samples, presetClientId, presetSampleId, presetSampleIds, onClose, onCreate }) {
  const { lang } = useT();
  const [clientId, setClientId] = useState(presetClientId || clients[0]?.id || '');
  const [date, setDate] = useState(todayISO());
  const [notes, setNotes] = useState('');
  const client = clientById(clients, clientId);
  const [lines, setLines] = useState(() => {
    if (presetSampleIds && presetSampleIds.length) {
      return presetSampleIds.map(id=>samples.find(x=>x.id===id)).filter(Boolean).map(s=>sampleToLine(client, s));
    }
    if (presetSampleId) {
      const s = samples.find(x=>x.id===presetSampleId);
      if (s) return [sampleToLine(client, s)];
    }
    return [];
  });
  const unbilled = samples.filter(s => s.client===clientId && !s.billingDocId);
  const total = lines.reduce((a,l)=>a+(Number(l.qty)||0)*(Number(l.unitPrice)||0), 0);

  const toggleSample = (s) => {
    setLines(prev => prev.some(l=>l.sampleId===s.id)
      ? prev.filter(l=>l.sampleId!==s.id)
      : [...prev, sampleToLine(client, s)]);
  };
  const addManualLine = () => setLines(prev => [...prev, { concept:'', tipo:'G', qty:1, unitPrice:0 }]);
  const setLine = (i, patch) => setLines(prev => prev.map((l,idx)=>idx===i?{...l,...patch}:l));
  const removeLine = (i) => setLines(prev => prev.filter((_,idx)=>idx!==i));

  const valid = clients.some(c=>c.id===clientId) && /^\d{4}-\d{2}-\d{2}$/.test(date) && lines.length>0 && lines.every(l=>l.concept.trim() && validNumber(l.qty,1,100000,true) && validNumber(l.unitPrice,0,100000000) && (!l.sampleId || samples.some(s=>s.id===l.sampleId && s.client===clientId)));

  const submit = () => {
    if (!valid) return;
    const code = nextDocCode(type);
    onCreate({ id:code, code, type, clientId, date, status:Object.keys(DOC_TYPES[type].statuses)[0], lines, notes });
  };

  return (
    <Portal>
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget && onClose()}>
      <div className="modal" style={{width:680}}>
        <div className="modal-head">
          <h3>{I.plus} Nuevo/a {docTypeLabel(lang,type).toLowerCase()}</h3>
          <p>El código se asigna automáticamente. Añade líneas desde las muestras del cliente o a mano.</p>
        </div>
        <div className="modal-body">
          <div className="new-sample-grid">
            <div className="field">
              <label className="field-label">Cliente / mútua *</label>
              <select className="field-input" value={clientId} onChange={e=>{setClientId(e.target.value); setLines([]);}}>
                {clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </div>
            <div className="field">
              <label className="field-label">Fecha</label>
              <input className="field-input" type="date" value={date} onChange={e=>setDate(e.target.value)}/>
            </div>
          </div>

          {unbilled.length>0 && (
            <>
              <div className="section-title" style={{marginTop:14}}>Muestras de este cliente sin facturar ({unbilled.length})</div>
              <div className="card" style={{marginBottom:14}}>
                {unbilled.map(s=>(
                  <label key={s.id} className="label-check-row" style={{cursor:'pointer',padding:'8px 12px'}}>
                    <input type="checkbox" checked={lines.some(l=>l.sampleId===s.id)} onChange={()=>toggleSample(s)} style={{width:15,height:15}}/>
                    <span className="mono" style={{fontWeight:600}}>{s.caseCode}</span>
                    <span style={{color:'var(--text-2)'}}>{s.type}</span>
                    <span style={{color:'var(--text-3)',marginLeft:'auto',fontSize:12}}>{sampleLinePrice(client, s).toFixed(2)} €</span>
                  </label>
                ))}
              </div>
            </>
          )}

          <div className="section-title" style={{marginTop:0,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <span>Líneas del documento</span>
            <button type="button" className="btn btn-ghost btn-sm" onClick={addManualLine}>{I.plus} Línea manual</button>
          </div>
          {lines.length===0 && <div style={{fontSize:12.5,color:'var(--text-3)',padding:'6px 0 10px'}}>Añade al menos una línea (desde muestras o a mano).</div>}
          {lines.map((l,i)=>(
            <div key={i} style={{display:'grid',gridTemplateColumns:'1fr 70px 90px 90px 28px',gap:6,alignItems:'center',marginBottom:6}}>
              <input className="field-input" placeholder="Concepto" value={l.concept} onChange={e=>setLine(i,{concept:e.target.value})} disabled={!!l.sampleId}/>
              <input className="field-input" type="number" min="1" value={l.qty} onChange={e=>setLine(i,{qty:Number(e.target.value)||1})}/>
              <input className="field-input" type="number" min="0" step="0.01" value={l.unitPrice} onChange={e=>setLine(i,{unitPrice:Number(e.target.value)||0})}/>
              <span style={{fontSize:12.5,fontWeight:600,textAlign:'right'}}>{((Number(l.qty)||0)*(Number(l.unitPrice)||0)).toFixed(2)} €</span>
              <button type="button" className="icon-btn-sm danger" onClick={()=>removeLine(i)} aria-label="Quitar línea"><Ico d={<><path d="M18 6 6 18M6 6l12 12"/></>} size={13}/></button>
            </div>
          ))}
          <div style={{textAlign:'right',fontSize:15,fontWeight:800,marginTop:8}}>Total: {total.toFixed(2)} €</div>

          <div className="field full" style={{marginTop:14}}>
            <label className="field-label">Notas (opcional)</label>
            <textarea className="field-input" rows={2} value={notes} onChange={e=>setNotes(e.target.value)}/>
          </div>
        </div>
        <div className="modal-foot">
          <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={submit} disabled={!valid}>Crear {docTypeLabel(lang,type).toLowerCase()}</button>
        </div>
      </div>
    </div>
    </Portal>
  );
}

/* ════════════════ PERSONAL ════════════════
   Horario semanal (asignar/mover/quitar horas) y buzón de vacaciones/cambios,
   con vista de administrador y vista de empleado — como no hay login real en
   esta demo, un selector simula "entrar como" cada perfil. */
const DAY_NAMES = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];

function visibleColleagues(staff, viewingStaff) {
  if (!viewingStaff) return [];
  if (viewingStaff.visibility === 'all') return staff;
  if (viewingStaff.visibility === 'team') return staff.filter(s=>s.role===viewingStaff.role || s.id===viewingStaff.id);
  return staff.filter(s=>s.id===viewingStaff.id);
}

function RangeCalendar({ startDate, endDate, onChange, color='#0088b2', markedDates=new Map() }) {
  const [visibleMonth, setVisibleMonth] = useState(() => { const d=new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); });
  const todayIso = ymd(new Date());

  const handleSelectDay = (day) => {
    const iso = ymd(day);
    if (iso < todayIso) return;
    if (!startDate || (startDate && endDate)) { onChange(iso, null); return; }
    if (iso < startDate) { onChange(iso, null); return; }
    onChange(startDate, iso);
  };

  const renderMonth = (monthDate) => {
    const cells = monthMatrix(monthDate.getFullYear(), monthDate.getMonth());
    return (
      <div style={{flex:'1 1 220px',minWidth:200}}>
        <p style={{textAlign:'center',fontWeight:700,fontSize:13,marginBottom:8,textTransform:'capitalize'}}>{MONTH_NAMES[monthDate.getMonth()]} {monthDate.getFullYear()}</p>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,textAlign:'center',fontSize:10.5,color:'var(--text-3)',marginBottom:4}}>
          {DOW_LABELS.map(l=><span key={l}>{l}</span>)}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2}}>
          {cells.map((day,i)=>{
            if (!day) return <span key={i}/>;
            const iso = ymd(day);
            const isStart = startDate===iso, isEnd = endDate===iso;
            const inRange = startDate && endDate && iso>startDate && iso<endDate;
            const isPast = iso < todayIso;
            const marked = markedDates.get(iso);
            const bg = (isStart||isEnd) ? color : inRange ? color+'33' : marked ? marked+'33' : 'transparent';
            const fg = (isStart||isEnd) ? '#fff' : marked ? marked : 'var(--text)';
            return (
              <button key={i} type="button" className="cal-day" disabled={isPast} onClick={()=>handleSelectDay(day)}
                style={{fontWeight:(isStart||isEnd)?700:500, background:bg, color:isPast?'var(--text-3)':fg,
                  opacity:isPast?0.4:1, cursor:isPast?'default':'pointer',
                  boxShadow: iso===todayIso && !isStart && !isEnd ? 'inset 0 0 0 1px var(--brand)' : 'none'}}>
                {day.getDate()}
              </button>
            );
          })}
        </div>
      </div>
    );
  };

  const nextMonthDate = new Date(visibleMonth.getFullYear(), visibleMonth.getMonth()+1, 1);

  return (
    <div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
        <button type="button" className="btn btn-ghost btn-sm" onClick={()=>setVisibleMonth(m=>new Date(m.getFullYear(),m.getMonth()-1,1))}>← Mes anterior</button>
        {(startDate||endDate) && <button type="button" className="btn btn-ghost btn-sm" onClick={()=>onChange(null,null)}>Borrar selección</button>}
        <button type="button" className="btn btn-ghost btn-sm" onClick={()=>setVisibleMonth(m=>new Date(m.getFullYear(),m.getMonth()+1,1))}>Mes siguiente →</button>
      </div>
      <div style={{display:'flex',gap:24,flexWrap:'wrap'}}>
        {renderMonth(visibleMonth)}
        {renderMonth(nextMonthDate)}
      </div>
    </div>
  );
}

function TeamAbsenceCalendar({ staff, staffRequests }) {
  const [visibleMonth, setVisibleMonth] = useState(() => { const d=new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); });
  const approved = staffRequests.filter(r=>r.status==='aprobada' && r.type!=='cambio_turno');
  const byDay = {};
  approved.forEach(r=>{
    expandDateRange(r.startDate, r.endDate||r.startDate).forEach(iso=>{ (byDay[iso] = byDay[iso]||[]).push(r.staffId); });
  });
  const nameFor = (id) => staff.find(s=>s.id===id);
  const cells = monthMatrix(visibleMonth.getFullYear(), visibleMonth.getMonth());

  return (
    <div className="card" style={{padding:16}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
        <button className="btn btn-ghost btn-sm" onClick={()=>setVisibleMonth(m=>new Date(m.getFullYear(),m.getMonth()-1,1))}>←</button>
        <strong style={{textTransform:'capitalize',fontSize:13.5}}>{MONTH_NAMES[visibleMonth.getMonth()]} {visibleMonth.getFullYear()}</strong>
        <button className="btn btn-ghost btn-sm" onClick={()=>setVisibleMonth(m=>new Date(m.getFullYear(),m.getMonth()+1,1))}>→</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:3,textAlign:'center',fontSize:10.5,color:'var(--text-3)',marginBottom:4}}>
        {DOW_LABELS.map(l=><span key={l}>{l}</span>)}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:3}}>
        {cells.map((day,i)=>{
          if (!day) return <div key={i}/>;
          const iso = ymd(day);
          const people = byDay[iso]||[];
          return (
            <div key={i} style={{minHeight:52,border:'1px solid var(--border)',borderRadius:6,padding:3}}>
              <div style={{fontWeight:600,color:'var(--text-3)',fontSize:10.5}}>{day.getDate()}</div>
              {people.slice(0,3).map((id,j)=>{
                const p = nameFor(id);
                return p ? <div key={j} title={p.name} style={{background:p.color+'22',color:p.color,borderRadius:3,padding:'1px 3px',marginTop:2,fontSize:9.5,fontWeight:700,overflow:'hidden',whiteSpace:'nowrap',textOverflow:'ellipsis'}}>{p.init}</div> : null;
              })}
              {people.length>3 && <div style={{fontSize:9,color:'var(--text-3)'}}>+{people.length-3}</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ScheduleGridAdmin({ staff, shifts, setShift, removeShift, onNewStaff, onEditStaff }) {
  const [editing, setEditing] = useState(null); // {staffId, day} | null
  const shiftFor = (staffId, day) => shifts.find(s=>s.staffId===staffId && s.day===day);
  const weeklyTotal = (staffId) => shifts.filter(s=>s.staffId===staffId).reduce((a,s)=>a+shiftHours(s),0);
  const editingStaff = editing && staff.find(s=>s.id===editing.staffId);

  return (
    <>
    <div className="card">
      <div className="card-head" style={{padding:'12px 16px'}}>
        <h3>Horario semanal</h3>
        <div className="card-actions"><button className="btn btn-primary btn-sm" onClick={onNewStaff}>{I.plus} Añadir empleado</button></div>
      </div>
      <div className="tbl-wrap">
        <table className="tbl wk-grid">
          <thead><tr><th>Empleado</th>{DOW_LABELS.map((d,i)=><th key={i}>{d}</th>)}<th>Total semana</th></tr></thead>
          <tbody>
            {staff.map(s=>{
              const total = weeklyTotal(s.id);
              const over = total > s.weeklyHours;
              return (
                <tr key={s.id}>
                  <td>
                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                      <div className="wl-av" style={{background:s.color,width:26,height:26,fontSize:10.5,flexShrink:0}}>{s.init}</div>
                      <div style={{minWidth:0}}>
                        <div style={{fontWeight:600,fontSize:12.5}}>{s.name}</div>
                        <div style={{fontSize:10.5,color:'var(--text-3)'}}>{s.role}</div>
                      </div>
                      <button className="icon-btn-sm" title="Editar empleado" aria-label={`Editar ${s.name}`} onClick={()=>onEditStaff(s)}><Ico d={<><path d="M17 3a2.85 2.83 0 114 4L7.5 20.5 2 22l1.5-5.5z"/></>} size={12}/></button>
                    </div>
                  </td>
                  {[0,1,2,3,4,5,6].map(day=>{
                    const sh = shiftFor(s.id, day);
                    return (
                      <td key={day} onClick={()=>setEditing({staffId:s.id, day})} style={{cursor:'pointer'}}>
                        {sh ? <span className="wk-chip" style={{background:s.color+'22',color:s.color}}>{sh.start}–{sh.end}</span> : <span className="wk-empty">+</span>}
                      </td>
                    );
                  })}
                  <td style={{fontWeight:700,color:over?'var(--red)':'var(--text)'}}>{total}h / {s.weeklyHours}h</td>
                </tr>
              );
            })}
            {staff.length===0 && <tr><td colSpan={9} style={{textAlign:'center',color:'var(--text-3)',padding:'18px 0'}}>Añade el primer empleado para empezar a asignar horas.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
    {editing && (
      <ShiftEditModal staffId={editing.staffId} day={editing.day} staffName={editingStaff?.name} existing={shiftFor(editing.staffId, editing.day)}
        onSave={(patch)=>{ setShift(editing.staffId, editing.day, patch); setEditing(null); }}
        onRemove={()=>{ removeShift(editing.staffId, editing.day); setEditing(null); }}
        onClose={()=>setEditing(null)} />
    )}
    </>
  );
}

function RequestsEmployee({ viewingStaff, staffRequests, addStaffRequest }) {
  const [type, setType] = useState('vacaciones');
  const [startDate, setStartDate] = useState(null);
  const [endDate, setEndDate] = useState(null);
  const [reason, setReason] = useState('');

  const myRequests = staffRequests.filter(r=>r.staffId===viewingStaff.id);
  const usedDays = myRequests.filter(r=>r.status==='aprobada' && r.type==='vacaciones')
    .reduce((sum,r)=>sum+expandDateRange(r.startDate, r.endDate||r.startDate).length, 0);
  const remaining = Math.max(0, viewingStaff.vacationTotal - usedDays);

  const markedDates = new Map();
  myRequests.filter(r=>r.status==='aprobada').forEach(r=>{
    expandDateRange(r.startDate, r.endDate||r.startDate).forEach(iso=>markedDates.set(iso, REQUEST_TYPES[r.type].color));
  });

  const needsReason = type==='cambio_turno';
  const valid = startDate && (!needsReason || reason.trim());

  const submit = () => {
    if (!valid) return;
    addStaffRequest({ staffId: viewingStaff.id, type, startDate, endDate: endDate||startDate, reason: reason.trim() });
    setStartDate(null); setEndDate(null); setReason('');
  };

  return (
    <div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,maxWidth:420,marginBottom:20}}>
        <div className="mini-stat"><div className="ms-num" style={{color:'var(--green)'}}>{remaining}<span style={{fontSize:14,fontWeight:500,color:'var(--text-3)'}}> / {viewingStaff.vacationTotal}</span></div><div className="ms-label">Días de vacaciones disponibles</div></div>
        <div className="mini-stat"><div className="ms-num">{usedDays}</div><div className="ms-label">Días ya cogidos este año</div></div>
      </div>

      <div className="section-title" style={{marginTop:0}}>Nueva petición</div>
      <div className="card" style={{padding:16,marginBottom:20}}>
        <div className="tipo-seg" style={{marginBottom:14,gridTemplateColumns:'repeat(3,1fr)'}}>
          {Object.keys(REQUEST_TYPES).map(k=>(
            <button type="button" key={k} className={type===k?'on':''} onClick={()=>setType(k)}>
              <span className="ts-label">{REQUEST_TYPES[k].label}</span>
            </button>
          ))}
        </div>
        <RangeCalendar startDate={startDate} endDate={endDate} onChange={(s,e)=>{setStartDate(s); setEndDate(e);}} color={REQUEST_TYPES[type].color} markedDates={markedDates}/>
        <div className="field" style={{marginTop:14,marginBottom:0}}>
          <label className="field-label">{needsReason ? 'Con quién y qué cambio propones *' : 'Motivo (opcional)'}</label>
          <textarea className="field-input" rows={2} value={reason} onChange={e=>setReason(e.target.value)} placeholder={needsReason ? 'p. ej. Cambiar mi turno del jueves con Pau Martí' : ''}/>
        </div>
        <button className="btn btn-primary" style={{marginTop:12}} onClick={submit} disabled={!valid}>{I.plus} Enviar petición</button>
      </div>

      <div className="section-title">Mis solicitudes</div>
      <div className="card">
        {myRequests.length===0 && <div style={{padding:16,fontSize:13,color:'var(--text-3)'}}>Todavía no has enviado ninguna petición.</div>}
        {myRequests.map(r=>(
          <div key={r.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 16px',borderBottom:'1px solid var(--border)'}}>
            <span className="tipo-tag" style={{background:REQUEST_TYPES[r.type].color+'22',color:REQUEST_TYPES[r.type].color}}>{REQUEST_TYPES[r.type].label}</span>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:12.5}}>{r.startDate}{r.endDate && r.endDate!==r.startDate ? ` → ${r.endDate}` : ''}</div>
              {r.reason && <div style={{fontSize:11.5,color:'var(--text-3)'}}>{r.reason}</div>}
            </div>
            <span className="status-pill" style={{background:REQUEST_STATUS[r.status].bg,color:REQUEST_STATUS[r.status].fg}}>{REQUEST_STATUS[r.status].label}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function Personal({ staff, addStaffMember, updateStaffMember, deleteStaffMember, shifts, setShift, removeShift, staffRequests, addStaffRequest, decideStaffRequest, showToast }) {
  const [role, setRole] = useState('admin'); // 'admin' | 'employee' — simula "entrar como", no hay login real
  const [viewingStaffId, setViewingStaffId] = useState(staff[0]?.id || null);
  const [tab, setTab] = useState('schedule'); // 'schedule' | 'requests'
  const [staffModal, setStaffModal] = useState(null); // null | 'new' | objeto empleado

  const viewingStaff = staff.find(s=>s.id===viewingStaffId) || staff[0] || null;
  const pendingCount = staffRequests.filter(r=>r.status==='pendiente').length;

  return (
    <div>
      <div className="page-head">
        <div>
          <h1>Personal</h1>
          <p>Horario semanal del equipo y buzón de vacaciones/cambios — inspirado en el portal de empleados real</p>
        </div>
        <div className="page-head-actions">
          <div className="seg">
            <button className={role==='admin'?'on':''} onClick={()=>setRole('admin')}>Vista administrador</button>
            <button className={role==='employee'?'on':''} onClick={()=>setRole('employee')}>Vista empleado</button>
          </div>
        </div>
      </div>

      {role==='employee' && (
        <div className="card" style={{marginBottom:16,padding:'10px 16px',display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
          <span style={{fontSize:12.5,color:'var(--text-2)'}}>Viendo como:</span>
          <select className="field-input" style={{maxWidth:260}} value={viewingStaffId||''} onChange={e=>setViewingStaffId(e.target.value)}>
            {staff.map(s=><option key={s.id} value={s.id}>{s.name} · {s.role}</option>)}
          </select>
        </div>
      )}

      <div className="card" style={{marginBottom:16}}>
        <div className="card-head" style={{padding:'12px 16px'}}>
          <div className="seg">
            <button className={tab==='schedule'?'on':''} onClick={()=>setTab('schedule')}>Horario semanal</button>
            <button className={tab==='requests'?'on':''} onClick={()=>setTab('requests')}>Vacaciones y peticiones{role==='admin' && pendingCount?` (${pendingCount})`:''}</button>
          </div>
        </div>
      </div>

      {!viewingStaff ? (
        <div className="card"><div className="empty"><div className="empty-ico">{I.calendar}</div><h3>Sin personal todavía</h3><p>Añade el primer empleado desde la vista de administrador.</p></div></div>
      ) : tab==='schedule' ? (
        role==='admin'
          ? <ScheduleGridAdmin staff={staff} shifts={shifts} setShift={setShift} removeShift={removeShift} onNewStaff={()=>setStaffModal('new')} onEditStaff={(s)=>setStaffModal(s)} />
          : <ScheduleGridEmployee staff={staff} shifts={shifts} viewingStaff={viewingStaff} />
      ) : (
        role==='admin'
          ? <RequestsInboxAdmin staff={staff} staffRequests={staffRequests} decideStaffRequest={decideStaffRequest} />
          : <RequestsEmployee viewingStaff={viewingStaff} staffRequests={staffRequests} addStaffRequest={addStaffRequest} />
      )}

      {staffModal && (
        <StaffModal
          staff={staffModal==='new' ? null : staffModal}
          onClose={()=>setStaffModal(null)}
          onSave={(data)=>{ if (staffModal==='new') addStaffMember(data); else updateStaffMember(staffModal.id, data); setStaffModal(null); }}
          onDelete={staffModal!=='new' ? ()=>{ deleteStaffMember(staffModal.id); setStaffModal(null); } : null}
        />
      )}
    </div>
  );
}

function Onboarding({ onClose, goTo }) {
  const [i, setI] = useState(0);
  const s = OB_STEPS[i];
  const last = i === OB_STEPS.length-1;
  useEffect(()=>{ goTo(s.view); }, [i]);
  const next = () => last ? onClose() : setI(i+1);
  const back = () => setI(Math.max(0,i-1));
  return (
    <Portal>
      <div className="ob-overlay" onClick={e=>e.target===e.currentTarget && onClose()}>
        <div className="ob-card">
          <div className="ob-hero">
            <div className="ob-step-ico">{s.ico}</div>
            <div className="ob-kicker">{s.kicker}</div>
            <div className="ob-title">{s.title}</div>
          </div>
          <div className="ob-body">
            <div className="ob-lead">{s.lead}</div>
            <div className="ob-steps">
              {s.steps.map((t,j)=>(
                <div className="ob-li" key={j}><div className="ob-num">{j+1}</div><div className="ob-li-text">{t}</div></div>
              ))}
            </div>
            {s.tip && <div className="ob-tip"><span>{s.tip}</span></div>}
          </div>
          <div className="ob-foot">
            <div className="ob-dots">{OB_STEPS.map((_,j)=><div key={j} className={`ob-dot${j===i?' on':''}`}></div>)}</div>
            <div className="ob-foot-btns">
              {i>0 && <button className="btn btn-ghost" onClick={back}>Atrás</button>}
              {!last && <button className="ob-skip" onClick={onClose}>Saltar guía</button>}
              <button className="btn btn-primary" onClick={next}>{last ? '¡Empezar!' : 'Siguiente'}</button>
            </div>
          </div>
        </div>
      </div>
    </Portal>
  );
}

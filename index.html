                  </div>
                  <div className="wl-count">{p.count} {t('dash.cases')}</div>
                </div>
              );
            })}
          </div>
        </div>

        <div className="card">
          <div className="card-head"><h3>{t('dash.bySpecialty')}</h3></div>
          <div style={{padding:'18px'}}>
            <div className="donut-wrap">
              <svg className="donut" viewBox="0 0 130 130">
                <circle cx="65" cy="65" r={R} fill="none" stroke="var(--surface-2)" strokeWidth="16"/>
                {segs.map((s,i)=>(
                  <circle key={i} cx="65" cy="65" r={R} fill="none" stroke={s.c} strokeWidth="16"
                    strokeDasharray={`${s.len*C} ${C}`} strokeDashoffset={`${-s.start*C}`}
                    transform="rotate(-90 65 65)" strokeLinecap="butt"/>
                ))}
                <text x="65" y="61" textAnchor="middle" fontSize="22" fontWeight="800" fill="var(--text)">{totalSpec}</text>
                <text x="65" y="77" textAnchor="middle" fontSize="9" fontWeight="600" fill="var(--text-3)">{t('dash.samplesWord')}</text>
              </svg>
              <div style={{flex:1}}>
                {bySpec.map((s,i)=>(
                  <div className="legend-item" key={i}>
                    <span className="legend-dot" style={{background:s.c}}></span>
                    <span className="legend-label">{s.name}</span>
                    <span className="legend-val">{s.count}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      </div>

      <div className="card">
        <div className="card-head">
          <h3>{t('dash.recentActivity')}</h3>
          <div className="card-actions"><button className="btn btn-ghost btn-sm" onClick={()=>setView('quality')}>{t('dash.seeAll')}</button></div>
        </div>
        <div>
          {AUDIT.slice(0,4).map((a,i)=>(
            <div className="audit-item" key={i}>
              <div className="audit-ico" style={{background:auditBg[a.bg][0],color:auditBg[a.bg][1]}}>{a.ico}</div>
              <div className="audit-main">
                <div className="audit-desc">{a.desc}</div>
                <div className="audit-sub">{a.who}</div>
              </div>
              <span className="audit-tag" style={{background:auditBg[a.tagc][0],color:auditBg[a.tagc][1]}}>{a.tag}</span>
              <div className="audit-time">{a.time}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ════════════════ SAMPLES ════════════════ */
function Samples({ samples, addSample, updateState, updateSample, clients, addClient, specialties, addSpecialty, insurers, addInsurer, doctors, addDoctor, materials, addMaterial, techniques, addTechnique, diagnosisCodes, addDiagnosisCode, markLabelsPrinted, lastReception, pinReception, setPinReception, search, setSearch, sampleFilters, patchSampleFilters, clearSampleFilters, pendingNew, clearPendingNew, onOpenReport, onOpenAdmin }) {
  const { t, lang } = useT();
  const [mode, setMode] = useState('kanban');
  const [selected, setSelected] = useState(null);
  const [showNew, setShowNew] = useState(false);
  const [showLabels, setShowLabels] = useState(false);
  const [showSelectionLabels, setShowSelectionLabels] = useState(false);
  const [selectedIds, setSelectedIds] = useState(() => new Set());
  const pendingLabels = samples.filter(s=>!s.labelsPrinted);
  const { spec: filter, state: stateFilter, client: clientFilter, insurer: insurerFilter, tipo: tipoFilter, numQuery } = sampleFilters;
  const setFilter = (v) => patchSampleFilters({spec:v});

  useEffect(()=>{ if (pendingNew) { setShowNew(true); clearPendingNew(); } }, [pendingNew]);

  const q = (search||'').trim().toLowerCase();
  const numMatch = parseNumberQuery(numQuery);
  const numOrder = parseNumberOrder(numQuery);
  let filtered = samples.filter(s=>{
    if (filter!=='all' && s.spec!==filter) return false;
    if (stateFilter!=='all' && s.state!==stateFilter) return false;
    if (clientFilter!=='all' && s.client!==clientFilter) return false;
    if (insurerFilter!=='all' && (s.insurer||'')!==insurerFilter) return false;
    if (tipoFilter!=='all' && s.tipo!==tipoFilter) return false;
    if (numMatch && !numMatch(s.n)) return false;
    const client = clientById(clients, s.client)?.name || '';
    if (q && !(`${s.id} ${s.caseCode||''} ${s.patient} ${s.type} ${s.ref} ${s.tech} ${client} ${s.notes||''}`.toLowerCase().includes(q))) return false;
    return true;
  });
  // Con números sueltos/rangos escritos a mano, se devuelve en ese mismo orden
  // (no en el orden interno de la lista) — "meto 921,3260-3262 y que salgan así".
  if (numOrder.length) filtered = [...filtered].sort((a,b)=>numOrder.indexOf(a.n)-numOrder.indexOf(b.n));
  const cols = ['recibida','tallado','procesando','diagnostico','validado'];
  const anyAdvancedFilter = numQuery.trim() || stateFilter!=='all' || clientFilter!=='all' || insurerFilter!=='all' || tipoFilter!=='all';
  const clearAdvanced = clearSampleFilters;

  // Selección múltiple: marcar varias muestras para una acción en bloque
  // (imprimir etiquetas o crear un documento de Administración con todas a la vez).
  const toggleSelect = (id) => setSelectedIds(prev => { const next = new Set(prev); next.has(id) ? next.delete(id) : next.add(id); return next; });
  const clearSelection = () => setSelectedIds(new Set());
  const selectAllVisible = () => setSelectedIds(new Set(filtered.map(s=>s.id)));
  const selectedSamples = samples.filter(s=>selectedIds.has(s.id));
  const selectedClientIds = [...new Set(selectedSamples.map(s=>s.client))];
  const canCreateDocFromSelection = selectedSamples.length>0 && selectedClientIds.length===1;

  return (
    <div>
      <div className="page-head">
        <div>
          <h1>{t('samples.title')}</h1>
          <p>{filtered.length} {filtered.length!==1?t('samples.samplePl'):t('samples.sampleSg')}{q?` · ${t('samples.resultsFor')} “${search}”`:` · ${t('samples.fullTraceability')}`}</p>
        </div>
        <div className="page-head-actions">
          <button className="btn btn-soft" onClick={()=>setShowLabels(true)} disabled={!pendingLabels.length}>{GL.tag} {t('samples.printLabels')}{pendingLabels.length?` (${pendingLabels.length})`:''}</button>
          <button className="btn btn-primary" onClick={()=>setShowNew(true)}>{I.plus} {t('samples.newSample')}</button>
        </div>
      </div>

      <div className="card" style={{marginBottom:16}}>
        <div className="card-head" style={{padding:'12px 16px'}}>
          <div className="seg">
            <button className={mode==='kanban'?'on':''} onClick={()=>setMode('kanban')}>{t('samples.flow')}</button>
            <button className={mode==='table'?'on':''} onClick={()=>setMode('table')}>{t('samples.table')}</button>
          </div>
          <div style={{display:'flex',gap:6,marginLeft:14,flexWrap:'wrap'}}>
            <button className={`btn btn-sm ${filter==='all'?'btn-soft':'btn-ghost'}`} onClick={()=>setFilter('all')}>{t('samples.all')}</button>
            {Object.keys(specialties).map(sp=>(
              <button key={sp} className={`btn btn-sm ${filter===sp?'btn-soft':'btn-ghost'}`} onClick={()=>setFilter(sp)}>{specialties[sp].short}</button>
            ))}
          </div>
          {q && <span className="search-chip" style={{marginLeft:'auto'}}>{I.search} “{search}” <button onClick={()=>setSearch('')}>×</button></span>}
        </div>
        <div className="card-head" style={{padding:'10px 16px',borderTop:'1px solid var(--line)',flexWrap:'wrap',gap:10}}>
          <div className="field" style={{margin:0,minWidth:190}}>
            <input className="field-input" placeholder={t('samples.numPlaceholder')} value={numQuery} onChange={e=>patchSampleFilters({numQuery:e.target.value})}/>
          </div>
          <select className="field-input" style={{maxWidth:170}} value={stateFilter} onChange={e=>patchSampleFilters({state:e.target.value})}>
            <option value="all">{t('samples.allStates')}</option>
            {Object.keys(STATES).map(k=><option key={k} value={k}>{stateLabelT(lang,k)}</option>)}
          </select>
          <select className="field-input" style={{maxWidth:220}} value={clientFilter} onChange={e=>patchSampleFilters({client:e.target.value})}>
            <option value="all">{t('samples.allClients')}</option>
            {clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
          </select>
          <select className="field-input" style={{maxWidth:180}} value={insurerFilter} onChange={e=>patchSampleFilters({insurer:e.target.value})}>
            <option value="all">Todas las mútuas</option>
            {insurers.map(i=><option key={i} value={i}>{i}</option>)}
          </select>
          <select className="field-input" style={{maxWidth:150}} value={tipoFilter} onChange={e=>patchSampleFilters({tipo:e.target.value})}>
            <option value="all">Todos los tipos</option>
            {Object.keys(TIPOS).map(k=><option key={k} value={k}>{k} · {TIPOS[k].label}</option>)}
          </select>
          {anyAdvancedFilter && <button className="btn btn-ghost btn-sm" onClick={clearAdvanced}>{t('samples.clearFilters')}</button>}
        </div>
      </div>

      {selectedIds.size>0 && (
        <div className="card" style={{marginBottom:16,padding:'10px 16px',display:'flex',alignItems:'center',gap:10,flexWrap:'wrap',background:'var(--brand-50)',borderColor:'var(--brand-500)'}}>
          <strong style={{fontSize:13}}>{selectedIds.size} {t('samples.selected')}</strong>
          <button className="btn btn-soft btn-sm" onClick={()=>setShowSelectionLabels(true)}>{GL.tag} {t('samples.printSelected')}</button>
          <button className="btn btn-soft btn-sm" disabled={!canCreateDocFromSelection} title={!canCreateDocFromSelection?t('samples.mixedClients'):''}
            onClick={()=>onOpenAdmin && onOpenAdmin({ clientId:selectedClientIds[0], sampleIds:[...selectedIds], openNew:true })}>{I.admin} {t('samples.createDocSelected')}</button>
          <button className="btn btn-sm" onClick={selectAllVisible}>{t('samples.selectAllVisible')} ({filtered.length})</button>
          <button className="btn btn-ghost btn-sm" style={{marginLeft:'auto'}} onClick={clearSelection}>{t('samples.clearSelection')}</button>
        </div>
      )}

      {mode==='kanban' ? (
        <div className="kanban">
          {cols.map(col=>{
            const items = filtered.filter(s=>s.state===col);
            return (
              <div className="kcol" key={col}>
                <div className="kcol-head">
                  <span className="kcol-dot" style={{background:STATES[col].dot}}></span>
                  <span className="kcol-title">{stateLabelT(lang,col)}</span>
                  <span className="kcol-count">{items.length}</span>
                </div>
                <div className="kcol-body">
                  {items.map(s=>{
                    const [bg,fg] = specStyle(specialties, s.spec);
                    return (
                      <div className={`scard${selectedIds.has(s.id)?' scard-picked':''}`} key={s.id} onClick={()=>setSelected(s)}>
                        <div className="scard-top">
                          <input type="checkbox" className="scard-check" checked={selectedIds.has(s.id)} onClick={e=>e.stopPropagation()} onChange={()=>toggleSelect(s.id)}/>
                          <span className="scard-id">{s.caseCode}{s.pots>1?` · ${s.pots} botes`:''}</span>
                          {s.urgent && <span className="scard-urgent">URGENTE</span>}
                        </div>
                        <div className="scard-name">{s.type}</div>
                        <div className="scard-patient">{GL.user} {s.patient}{s.age?` · ${s.age}a`:''}</div>
                        <div className="scard-client">{clientById(clients, s.client)?.name || s.ref}</div>
                        <div className="scard-foot">
                          <span className="tipo-tag">{s.tipo}</span>
                          <span className="spec-pill" style={{background:bg,color:fg}}>{specShort(specialties, s.spec)}</span>
                          <span className="scard-date">{s.received.split(' ')[0]}</span>
                        </div>
                      </div>
                    );
                  })}
                  {items.length===0 && <div style={{fontSize:11.5,color:'var(--text-3)',textAlign:'center',padding:'14px 0'}}>{t('samples.noneInCol')}</div>}
                </div>
              </div>
            );
          })}
        </div>
      ) : (
        <div className="card">
          <div className="tbl-wrap">
            <table className="tbl">
              <thead><tr>
                <th style={{width:32}}><input type="checkbox" checked={filtered.length>0 && filtered.every(s=>selectedIds.has(s.id))} onChange={()=>{ filtered.every(s=>selectedIds.has(s.id)) ? clearSelection() : selectAllVisible(); }}/></th>
                <th>{t('samples.colCode')}</th><th>{t('samples.colType')}</th><th>{t('samples.colSample')}</th><th>{t('samples.colPatient')}</th><th>{t('samples.colClient')}</th><th>{t('samples.colSpec')}</th><th>{t('samples.colState')}</th><th>{t('samples.colReceived')}</th>
              </tr></thead>
              <tbody>
                {filtered.map(s=>{
                  const [sbg,sfg]=stateBg[s.state]; const [bg,fg]=specStyle(specialties, s.spec);
                  return (
                    <tr key={s.id} onClick={()=>setSelected(s)} className={selectedIds.has(s.id)?'row-picked':''}>
                      <td onClick={e=>e.stopPropagation()}><input type="checkbox" checked={selectedIds.has(s.id)} onChange={()=>toggleSelect(s.id)}/></td>
                      <td><span className="mono">{s.caseCode}</span>{s.urgent && <span className="scard-urgent" style={{marginLeft:8}}>URG</span>}</td>
                      <td><span className="tipo-tag" title={TIPOS[s.tipo]?.label}>{s.tipo}</span></td>
                      <td style={{fontWeight:600,maxWidth:230}}>{s.type}{s.pots>1?<span style={{color:'var(--text-3)',fontWeight:500}}> · {s.pots} botes</span>:null}</td>
                      <td>{s.patient} <span style={{color:'var(--text-3)'}}>· {s.age?`${s.age}a `:''}{s.sex}</span></td>
                      <td style={{color:'var(--text-2)'}}>{clientById(clients, s.client)?.name || s.ref}</td>
                      <td><span className="spec-pill" style={{background:bg,color:fg}}>{specShort(specialties, s.spec)}</span></td>
                      <td><span className="status-pill" style={{background:sbg,color:sfg}}><span className="sp-dot" style={{background:sfg}}></span>{stateLabelT(lang,s.state)}</span></td>
                      <td style={{color:'var(--text-3)',fontSize:12}}>{s.received}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {filtered.length===0 && (
        <div className="card"><div className="empty"><div className="empty-ico">{I.search}</div><h3>{t('samples.emptyTitle')}</h3><p>{t('samples.emptyDesc')}</p>{q && <button className="btn btn-soft" style={{marginTop:14}} onClick={()=>setSearch('')}>{t('samples.clearSearch')}</button>}</div></div>
      )}

      {selected && <SampleDrawer sample={samples.find(x=>x.id===selected.id)||selected} onClose={()=>setSelected(null)} updateState={updateState} updateSample={updateSample} clients={clients} specialties={specialties} materials={materials} addMaterial={addMaterial} techniques={techniques} addTechnique={addTechnique} diagnosisCodes={diagnosisCodes} addDiagnosisCode={addDiagnosisCode} markLabelsPrinted={markLabelsPrinted} onOpenAdmin={onOpenAdmin} setSelected={setSelected} onOpenReport={onOpenReport} />}
      {showNew && <NewSampleModal onClose={()=>setShowNew(false)} onAdd={(s)=>{addSample(s); setShowNew(false);}} clients={clients} addClient={addClient} specialties={specialties} addSpecialty={addSpecialty} insurers={insurers} addInsurer={addInsurer} doctors={doctors} addDoctor={addDoctor} lastReception={lastReception} pinReception={pinReception} setPinReception={setPinReception} />}
      {showLabels && <LabelsModal candidates={pendingLabels} onClose={()=>setShowLabels(false)} markPrinted={markLabelsPrinted} />}
      {showSelectionLabels && <LabelsModal candidates={selectedSamples} onClose={()=>setShowSelectionLabels(false)} markPrinted={markLabelsPrinted} />}
    </div>
  );
}

function SampleDrawer({ sample, onClose, updateState, updateSample, clients, specialties, materials=[], addMaterial=()=>{}, techniques=[], addTechnique=()=>{}, diagnosisCodes={}, addDiagnosisCode=()=>{}, markLabelsPrinted=null, onOpenAdmin=null, setSelected, onOpenReport }) {
  const { lang } = useT();
  const [printLabels, setPrintLabels] = useState(null); // array de etiquetas a imprimir ya, o null
  const s = sample;
  const [bg,fg] = specStyle(specialties, s.spec);
  const trace = TRACE(s);
  const client = clientById(clients, s.client);
  const letters = potLetters(s.pots || 1);
  const order = ['recibida','tallado','procesando','diagnostico','validado'];
  const nextState = order[Math.min(order.indexOf(s.state)+1, order.length-1)];
  const canAdvance = s.state !== 'validado' && s.state !== 'diagnostico';
  const [desc, setDesc] = useState(s.desc || '');
  const [material, setMaterial] = useState(s.material || '');
  // Nº de bloques de parafina por bote (una muestra puede necesitar más de uno,
  // p. ej. A1, A2, A3): se parte de 1 por bote y el técnico ajusta el que haga falta.
  const [blockCounts, setBlockCounts] = useState(() => {
    if (s.blockCounts) return s.blockCounts;
    const init = {}; letters.forEach(l => init[l] = 1); return init;
  });
  const setBlocksFor = (letter, n) => setBlockCounts(prev => ({ ...prev, [letter]: Math.max(1, Math.min(9, Number(n)||1)) }));
  const totalBlocks = Object.values(blockCounts).reduce((a,b)=>a+(Number(b)||0), 0);

  // Varias técnicas a la vez (rutina + lo que haga falta), y se pueden seguir
  // añadiendo más adelante aunque el caso ya esté en pasos posteriores.
  const [techniqueList, setTechniqueList] = useState(() => s.techniques || (s.technique ? [s.technique] : []));
  const [techniqueInput, setTechniqueInput] = useState('');
  const addTechniqueToList = (val) => {
    const clean = (val ?? techniqueInput).trim();
    if (!clean) return;
    setTechniqueList(prev => prev.includes(clean) ? prev : [...prev, clean]);
    setTechniqueInput('');
  };
  const removeTechniqueFromList = (t) => setTechniqueList(prev => prev.filter(x=>x!==t));

  const applyTemplate = (mat) => {
    setMaterial(mat);
    if (!desc.trim() && MACRO_TEMPLATES[mat]) setDesc(MACRO_TEMPLATES[mat]);
  };

  const saveInclusion = () => {
    const patch = {};
    if ((s.desc||'') !== desc) patch.desc = desc;
    if ((s.material||'') !== material) patch.material = material;
    if (JSON.stringify(s.techniques||[]) !== JSON.stringify(techniqueList)) patch.techniques = techniqueList;
    if (JSON.stringify(s.blockCounts||{}) !== JSON.stringify(blockCounts)) patch.blockCounts = blockCounts;
    if (Object.keys(patch).length) updateSample && updateSample(s.id, patch);
  };
  // Todo lo de Macroscopia/Técnicas queda siempre editable (también después de
  // Diagnóstico o Validado) — persiste solo al terminar de tocar cada campo.
  useEffect(() => { saveInclusion(); /* eslint-disable-next-line react-hooks/exhaustive-deps */ }, [techniqueList, blockCounts]);

  // Procesamiento: láminas H&E — obligatorio imprimir sus etiquetas antes de
  // poder pasar a Diagnóstico (a diferencia de todo lo demás, que no bloquea).
  const [heSlideCount, setHeSlideCount] = useState(s.heSlideCount || totalBlocks || 1);
  const heLabelsPrinted = !!s.heLabelsPrinted;
  const printHE = () => {
    updateSample(s.id, { heSlideCount, heLabelsPrinted:true, slides:heSlideCount });
    setSelected({ ...s, heSlideCount, heLabelsPrinted:true, slides:heSlideCount });
    setPrintLabels(heLabelsForSample(s, heSlideCount));
  };
  const advanceBlocked = s.state === 'procesando' && !heLabelsPrinted;

  // Diagnóstico: la patóloga apunta un código abreviado propio del laboratorio
  // y el sistema carga el texto de diagnóstico preformateado para ese código —
  // la secretaria solo lo transcribe. En cuanto están código y texto, el caso
  // se valida solo: diagnosticar ya ES validar, no hace falta un paso aparte.
  const [diagCode, setDiagCode] = useState(s.diagnosisCode || '');
  const [diagText, setDiagText] = useState(s.diagnosisText || '');

  const applyDiagCode = (code) => {
    setDiagCode(code);
    const known = diagnosisCodes[code.trim()];
    if (known && !diagText.trim()) setDiagText(known);
  };

  const finishDiagnosisField = () => {
    const patch = {};
    if ((s.diagnosisCode||'') !== diagCode) patch.diagnosisCode = diagCode;
    if ((s.diagnosisText||'') !== diagText) patch.diagnosisText = diagText;
    if (s.state === 'diagnostico' && diagCode.trim() && diagText.trim()) {
      if (!diagnosisCodes[diagCode.trim()]) addDiagnosisCode(diagCode.trim(), diagText.trim());
      patch.state = 'validado';
    }
    if (Object.keys(patch).length) updateSample && updateSample(s.id, patch);
    if (patch.state) { updateState(s.id, patch.state); setSelected({ ...s, ...patch }); }
  };

  const advance = () => {
    if (advanceBlocked) return;
    if (material.trim() && !materials.includes(material.trim())) addMaterial(material.trim());
    techniqueList.forEach(t => { if (t.trim() && !techniques.includes(t.trim())) addTechnique(t.trim()); });
    saveInclusion();
    updateState(s.id, nextState);
    setSelected({ ...s, state: nextState, desc, material, techniques:techniqueList, blockCounts, heSlideCount, heLabelsPrinted });
  };

  return (
    <>
    <Portal>
    <div className="drawer-overlay" onClick={e=>e.target===e.currentTarget && onClose()}>
      <div className="drawer">
        <div className="drawer-head">
          <div>
            <div className="dh-id"><span className="mono" style={{color:'var(--brand-700)'}}>{s.caseCode}</span> · {s.id} {s.urgent && <span style={{color:'var(--red)'}}>· URGENTE</span>}</div>
            <h2>{s.type}</h2>
          </div>
          <button className="drawer-close" onClick={onClose} aria-label="Cerrar"><Ico d={<><path d="M18 6 6 18M6 6l12 12"/></>} size={17}/></button>
        </div>
        <div className="drawer-body">
          <div style={{marginBottom:6,display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
            <span className="tipo-tag" title={TIPOS[s.tipo]?.label}>{s.tipo}</span>
            <span className="spec-pill" style={{background:bg,color:fg,fontSize:11.5,padding:'4px 11px'}}>{s.spec}</span>
            {(() => { const [sbg,sfg]=stateBg[s.state]; return <span className="status-pill" style={{background:sbg,color:sfg}}><span className="sp-dot" style={{background:sfg}}></span>{stateLabelT(lang,s.state)}</span>; })()}
          </div>

          <div className="detail-grid" style={{marginTop:18}}>
            <div className="detail-item"><div className="di-label">Paciente</div><div className="di-val">{s.patient}</div></div>
            <div className="detail-item"><div className="di-label">Edad / Sexo</div><div className="di-val">{s.age ? `${s.age} años` : <span style={{color:'var(--text-3)',fontStyle:'italic'}}>Sin edad</span>} · {s.sex==='M'?'Mujer':'Hombre'}</div></div>
            <div className="detail-item"><div className="di-label">Nº historia clínica</div><div className="di-val">{s.historyNumber || <span style={{color:'var(--text-3)',fontStyle:'italic'}}>—</span>}</div></div>
            <div className="detail-item"><div className="di-label">Fecha de nacimiento</div><div className="di-val">{s.birthDate || <span style={{color:'var(--text-3)',fontStyle:'italic'}}>—</span>}</div></div>
            <div className="detail-item"><div className="di-label">Centro médico</div><div className="di-val">{client?.name || s.ref}{client && client.discount>0 && <span style={{color:'var(--text-3)',fontWeight:500}}> · dto. {client.discount}%</span>}{s.centerRefNumber && <span style={{color:'var(--text-3)',fontWeight:500}}> · ref. centro: {s.centerRefNumber}</span>}</div></div>
            <div className="detail-item"><div className="di-label">Mútua / aseguradora</div><div className="di-val">{s.insurer || <span style={{color:'var(--text-3)',fontStyle:'italic'}}>Particular / sin especificar</span>}</div></div>
            <div className="detail-item"><div className="di-label">Médico solicitante</div><div className="di-val">{s.ref}</div></div>
            <div className="detail-item"><div className="di-label">Tipo de muestra</div><div className="di-val">{s.tipo} · {TIPOS[s.tipo]?.label}</div></div>
            <div className="detail-item"><div className="di-label">Nº de botes</div><div className="di-val">{s.pots} {s.pots===1?'bote':'botes'} ({letters.map(l=>`${s.caseCode}-${l}`).join(', ')})</div></div>
            <div className="detail-item"><div className="di-label">Patólogo asignado</div><div className="di-val">{s.tech}</div></div>
            <div className="detail-item"><div className="di-label">Recepción</div><div className="di-val">{s.received}</div></div>
          </div>

          <div className="section-title">Botes recibidos</div>
          <div className="chip-row">
            {letters.map((l,i)=>(
              <div className="obj-chip" key={'pot'+i}><span className="oc-ico">{GL.flask}</span><span className="oc-id">{s.caseCode}-{l}</span><span className="oc-meta">Bote {i+1}</span></div>
            ))}
          </div>
          {markLabelsPrinted && (
            <div style={{display:'flex',alignItems:'center',gap:10,marginTop:8,fontSize:12.5}}>
              {s.labelsPrinted
                ? <span style={{color:'var(--green)'}}>{GL.check} Etiquetas impresas</span>
                : <span style={{color:'var(--amber)'}}>{GL.alert} Etiquetas pendientes de imprimir</span>}
              <button className="btn btn-ghost btn-sm" onClick={()=>{ markLabelsPrinted([s.id]); setPrintLabels(labelsForSample(s)); }}>{s.labelsPrinted?'Reimprimir':'Imprimir'} etiquetas</button>
            </div>
          )}
          {onOpenAdmin && (
            <div style={{display:'flex',alignItems:'center',gap:10,marginTop:8,fontSize:12.5}}>
              {s.billingDocId
                ? <span style={{color:'var(--green)'}}>{GL.check} Facturación: {s.billingDocId}</span>
                : <span style={{color:'var(--text-3)'}}>{GL.alert} Sin incluir en ningún documento de Administración</span>}
              <button className="btn btn-ghost btn-sm" onClick={()=>onOpenAdmin(s.billingDocId ? { docId:s.billingDocId } : { clientId:s.client, sampleId:s.id, openNew:true })}>{s.billingDocId?'Ver documento':'Crear factura con esta muestra'}</button>
            </div>
          )}

          <div className="section-title">Macroscopia · tipo de material</div>
          <div>
            <input className="field-input" list="materials-dl" placeholder="Escribe o elige un tipo de material…" value={material} onChange={e=>applyTemplate(e.target.value)} onBlur={saveInclusion}/>
            <datalist id="materials-dl">{materials.map(m=><option key={m} value={m}/>)}</datalist>
          </div>

          <div className="section-title">Descripción macroscópica de las muestras</div>
          <textarea className="field-input" rows={3} value={desc} onChange={e=>setDesc(e.target.value)} onBlur={saveInclusion}
            placeholder="Describe las muestras recibidas (nº de fragmentos, tamaño, color, tallado…)."/>

          <div className="section-title">Técnicas</div>
          <div className="chip-row" style={{marginBottom:8}}>
            {techniqueList.map(tItem=>(
              <div className="obj-chip" key={tItem}>
                <span className="oc-id">{tItem}</span>
                <button type="button" onClick={()=>removeTechniqueFromList(tItem)} aria-label={`Quitar ${tItem}`} style={{border:'none',background:'none',cursor:'pointer',color:'var(--text-3)',marginLeft:4,fontSize:13}}>×</button>
              </div>
            ))}
            {techniqueList.length===0 && <span style={{fontSize:12,color:'var(--text-3)',fontStyle:'italic'}}>Sin técnicas añadidas todavía.</span>}
          </div>
          <div style={{display:'flex',gap:6}}>
            <input className="field-input" list="techniques-dl" placeholder="Añadir técnica (H&E, PAS, IHQ…) y Enter" value={techniqueInput}
              onChange={e=>setTechniqueInput(e.target.value)}
              onKeyDown={e=>{ if (e.key==='Enter') { e.preventDefault(); addTechniqueToList(); } }}/>
            <datalist id="techniques-dl">{techniques.map(tOpt=><option key={tOpt} value={tOpt}/>)}</datalist>
            <button type="button" className="btn btn-soft btn-sm" onClick={()=>addTechniqueToList()}>{I.plus} Añadir</button>
          </div>

          <div className="section-title">Material procesado · {totalBlocks} bloque{totalBlocks!==1?'s':''} en total</div>
          <div className="chip-row" style={{marginBottom:8}}>
            {letters.map(l=>(
              <div key={'bc'+l} style={{display:'flex',alignItems:'center',gap:6,fontSize:12,background:'var(--bg-soft, #f4f5f7)',borderRadius:8,padding:'5px 8px'}}>
                <span style={{fontWeight:600}}>Bote {l}</span>
                <button type="button" className="btn btn-ghost btn-sm" style={{width:24,height:24,padding:0}} onClick={()=>setBlocksFor(l,(blockCounts[l]||1)-1)} disabled={(blockCounts[l]||1)<=1} aria-label={`Restar bloque a ${l}`}>−</button>
                <span style={{minWidth:14,textAlign:'center'}}>{blockCounts[l]||1}</span>
                <button type="button" className="btn btn-ghost btn-sm" style={{width:24,height:24,padding:0}} onClick={()=>setBlocksFor(l,(blockCounts[l]||1)+1)} disabled={(blockCounts[l]||1)>=9} aria-label={`Sumar bloque a ${l}`}>+</button>
                <span style={{color:'var(--text-3)'}}>bloque{(blockCounts[l]||1)!==1?'s':''}</span>
              </div>
            ))}
          </div>
          <div className="chip-row">
            {letters.flatMap(l => Array.from({length: blockCounts[l]||0}).map((_,i)=>(
              <div className="obj-chip" key={'b'+l+i}><span className="oc-ico">{GL.layers}</span><span className="oc-id">{s.caseCode}-{l}{i+1}</span><span className="oc-meta">Bloque parafina</span></div>
            )))}
          </div>

          <div className="section-title">Procesamiento · láminas H&E</div>
          <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap',marginBottom:8}}>
            <label style={{fontSize:12.5,color:'var(--text-2)'}}>Nº de láminas a generar</label>
            <input className="field-input" style={{width:80,textAlign:'center'}} type="number" min="1" value={heSlideCount} onChange={e=>setHeSlideCount(Math.max(1,Number(e.target.value)||1))}/>
            <button type="button" className="btn btn-primary btn-sm" onClick={printHE}>{GL.tag} {heLabelsPrinted?'Reimprimir':'Imprimir'} etiquetas H&E</button>
            {heLabelsPrinted
              ? <span style={{color:'var(--green)',fontSize:12.5}}>{GL.check} Impresas</span>
              : <span style={{color:'var(--amber)',fontSize:12.5}}>{GL.alert} Pendientes — obligatorio para pasar a Diagnóstico</span>}
          </div>
          <div className="chip-row">
            {heLabelsPrinted
              ? Array.from({length: s.heSlideCount||0}).map((_,i)=>(
                  <div className="obj-chip" key={'he'+i}><span className="oc-ico">{GL.micro}</span><span className="oc-id">{s.caseCode}-L{i+1}</span><span className="oc-meta">H&E</span></div>
                ))
              : <div style={{fontSize:12,color:'var(--text-3)',padding:'4px 0'}}>Láminas pendientes de imprimir etiqueta.</div>}
          </div>

          <div className="section-title">Diagnóstico · código del laboratorio</div>
          <div>
            <input className="field-input" list="diagcodes-dl" placeholder="Código, p. ej. piel 1.3" value={diagCode} onChange={e=>applyDiagCode(e.target.value)} onBlur={finishDiagnosisField} style={{marginBottom:8}}/>
            <datalist id="diagcodes-dl">{Object.keys(diagnosisCodes).map(c=><option key={c} value={c}/>)}</datalist>
            <textarea className="field-input" rows={2} value={diagText} onChange={e=>setDiagText(e.target.value)} onBlur={finishDiagnosisField}
              placeholder="Texto de diagnóstico para el informe (se carga solo si el código ya existe)."/>
            {!diagnosisCodes[diagCode.trim()] && diagCode.trim() && <div className="inline-hint">Código nuevo: se guardará con el texto que escribas para la próxima vez.</div>}
            {s.state==='diagnostico' && <div className="inline-hint">En cuanto código y texto estén completos, el caso se valida solo — el patólogo no tiene que darle a nada aparte.</div>}
          </div>

          <div className="section-title">Codificación SNOMED CT</div>
          <div className="snomed-box">
            <div className="snomed-desc">Pendiente de codificación por el patólogo. La especialidad no determina el diagnóstico ni su código.</div>
          </div>

          <div className="section-title">Trazabilidad</div>
          <div className="timeline">
            {trace.map((t,i)=>(
              <div className="tl-item" key={i}>
                <div className={`tl-dot ${t.status}`}></div>
                <div className="tl-title">{t.t}</div>
                <div className="tl-meta">{t.who} · {t.when}</div>
              </div>
            ))}
          </div>
        </div>
        <div className="drawer-foot">
          {s.state==='diagnostico' && <button className="btn btn-soft" style={{flex:1}} disabled>Se valida sola al completar el diagnóstico</button>}
          {s.state==='validado' && <button className="btn btn-soft" style={{flex:1}} disabled>Caso validado y cerrado</button>}
          {canAdvance && <button className="btn btn-primary" style={{flex:1}} onClick={advance} disabled={advanceBlocked} title={advanceBlocked?'Imprime las etiquetas H&E para poder pasar a Diagnóstico':''}>Avanzar a: {stateLabelT(lang,nextState)}</button>}
          <button className="btn btn-ghost" onClick={()=>{ saveInclusion(); finishDiagnosisField(); onClose(); onOpenReport && onOpenReport(s.id); }}>{I.doc} Informe</button>
        </div>
      </div>
    </div>
    </Portal>
    {printLabels && <QuickPrintLabels labels={printLabels} onDone={()=>setPrintLabels(null)} />}
    </>
  );
}

function NewSampleModal({ onClose, onAdd, clients, addClient, specialties, addSpecialty, insurers, addInsurer, doctors, addDoctor, lastReception, pinReception, setPinReception }) {
  const pinned = pinReception && lastReception;
  const pinnedClientName = pinned ? (clientById(clients, lastReception.client)?.name || '') : '';
  const [f, setF] = useState({
    type:'', patient:'', age:'', sex:'M', historyNumber:'', birthDate:'',
    clientName: pinned ? pinnedClientName : (clients[0]?.name||''),
    centerRefNumber:'',
    insurer: pinned ? (lastReception.insurer||'') : '',
    ref: pinned ? (lastReception.ref||'') : '',
    tipo:'B', pots:1, spec:Object.keys(specialties)[0]||'', urgent:false,
  });
  const set = (k,v) => setF(p=>({...p,[k]:v}));
  // Único requisito real: saber de quién es la muestra. Todo lo demás se puede
  // completar luego — "meto 50 muestras de golpe" no puede depender de tenerlo
  // todo a mano en ese momento. Lo que sí se rellena se valida (edad/botes).
  const valid = f.patient.trim().length > 0 && (!f.age.trim() || validNumber(f.age,0,120,true)) && validNumber(f.pots,1,12,true);

  const matchedClient = clients.find(c => c.name.trim().toLowerCase() === f.clientName.trim().toLowerCase());
  const isNewClient = f.clientName.trim() && !matchedClient;
  const isNewSpec = f.spec.trim() && !specialties[f.spec.trim()];
  const previewCode = `${String(new Date().getFullYear()).slice(-2)}${f.tipo}${CASE_SEQ}`;
  const letters = potLetters(f.pots);
  const setPots = (n) => set('pots', Math.max(1, Math.min(12, Math.floor(Number(n))||1)));

  const submit = () => {
    if (!valid) return;
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,'0'), mm = String(now.getMinutes()).padStart(2,'0');
    const caseNo = CASE_SEQ++;

    // Cliente, especialidad, mútua y médico son campos abiertos: si lo escrito no
    // existe todavía en el laboratorio, se da de alta aquí mismo con este registro.
    let clientId = matchedClient?.id;
    if (!clientId) {
      clientId = uid('cli');
      addClient({ id: clientId, name: f.clientName.trim(), type:'Cliente', discount:0, rate:{ B:100, C:60, P:75 } });
    }
    const specName = f.spec.trim();
    if (specName && !specialties[specName]) addSpecialty(specName);
    if (f.insurer.trim()) addInsurer(f.insurer.trim());
    if (f.ref.trim()) addDoctor(f.ref.trim());

    const ns = mkSample({
      n: ++SID, caseNo, year:String(now.getFullYear()).slice(-2), tipo:f.tipo, client:clientId, pots:Number(f.pots)||1,
      type:f.type.trim() || 'Sin descripción todavía', patient:f.patient.trim(),
      age: f.age ? Number(f.age) : null, sex:f.sex,
      historyNumber:f.historyNumber.trim(), birthDate:f.birthDate||null,
      centerRefNumber:f.centerRefNumber.trim(),
      insurer:f.insurer.trim(), ref:f.ref.trim()||matchedClient?.name||f.clientName.trim(), spec:specName, tech: PATHOLOGISTS.find(p=>p.spec===specName)?.name || 'Por asignar',
      // Recepción es un lote aparte: en cuanto se registra, la muestra ya está
      // lista para el siguiente paso (Inclusión) en otro puesto — nadie tiene
      // que "avanzarla" a mano desde Recepción.
      state:'tallado', urgent:f.urgent, received:`${pad2(now.getDate())}/${pad2(now.getMonth()+1)} ${hh}:${mm}`, receivedAt:now.toISOString(), blocks:0, slides:0
    });
    onAdd(ns);
  };

  return (
    <Portal>
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget && onClose()}>
      <div className="modal" style={{width:600}}>
        <div className="modal-head">
          <h3>{I.plus} Recepción de muestra</h3>
          <p>Registro de entrada. El código de caso se asigna automáticamente.</p>
        </div>
        <div className="modal-body">
          {/* Vista previa del código de caso generado en vivo */}
          <div className="code-preview">
            <div>
              <div className="cp-label">Código de caso</div>
              <div className="cp-code">{previewCode}{f.pots>1 && <span className="cp-range">-A … -{letters[letters.length-1]}</span>}</div>
            </div>
            <div className="cp-pots">
              {letters.map(l=><span key={l} className="cp-pot">{previewCode}-{l}</span>)}
            </div>
          </div>

          <div className="new-sample-grid">
            <div className="field full" style={{marginBottom:pinned?0:undefined}}>
              <label style={{display:'flex',alignItems:'center',gap:8,cursor: lastReception ? 'pointer' : 'default',fontSize:12.5,color:'var(--text-2)',marginBottom:10}}>
                <input type="checkbox" checked={pinReception} disabled={!lastReception} onChange={e=>setPinReception(e.target.checked)} style={{width:14,height:14}}/>
                Usar el mismo centro, mútua y médico que en la última muestra registrada
                {!lastReception && <span style={{color:'var(--text-3)'}}> (todavía no hay ninguna en esta sesión)</span>}
              </label>
            </div>

            <div className="field full">
              <label className="field-label">Centro médico / cliente</label>
              <input className="field-input" list="clients-dl" placeholder="Escribe o elige un hospital, clínica o centro derivador…" value={f.clientName} onChange={e=>set('clientName',e.target.value)}/>
              <datalist id="clients-dl">{clients.map(c=><option key={c.id} value={c.name}/>)}</datalist>
              {matchedClient && matchedClient.discount>0 && <div className="field-note ok">Cliente existente · descuento {matchedClient.discount}% ya aplicado.</div>}
              {matchedClient && matchedClient.internalCode && <div className="field-note">Nº interno de este centro: <strong>{matchedClient.internalCode}</strong></div>}
              {isNewClient && <div className="field-note new">Es un cliente nuevo: se dará de alta con este registro (sin descuento; edítalo luego en «Clientes y tarifas»).</div>}
            </div>

            <div className="field">
              <label className="field-label">Mútua / aseguradora (opcional)</label>
              <input className="field-input" list="insurers-dl" placeholder="Axa, Sanitas… o particular" value={f.insurer} onChange={e=>set('insurer',e.target.value)}/>
              <datalist id="insurers-dl">{insurers.map(i=><option key={i} value={i}/>)}</datalist>
            </div>
            <div className="field">
              <label className="field-label">Médico solicitante (opcional)</label>
              <input className="field-input" list="doctors-dl" placeholder="Dr. / Dra. …" value={f.ref} onChange={e=>set('ref',e.target.value)}/>
              <datalist id="doctors-dl">{doctors.map(d=><option key={d} value={d}/>)}</datalist>
            </div>
            <div className="field full">
              <label className="field-label">Nº de referencia de este centro para esta muestra (opcional)</label>
              <input className="field-input" placeholder="Algunos centros dan su propio número por muestra, aparte del nº interno fijo" value={f.centerRefNumber} onChange={e=>set('centerRefNumber',e.target.value)}/>
            </div>

            <div className="field full">
              <label className="field-label">Tipo de muestra</label>
              <div className="tipo-seg">
                {Object.keys(TIPOS).map(k=>(
                  <button type="button" key={k} className={f.tipo===k?'on':''} onClick={()=>set('tipo',k)}>
                    <span className="ts-letter">{k}</span>
                    <span className="ts-label">{TIPOS[k].label}</span>
                  </button>
                ))}
              </div>
              <div className="field-note">Los cultivos microbiológicos se registran por circuito aparte.</div>
            </div>

            <div className="field">
              <label className="field-label">Nº de botes / muestras</label>
              <div style={{display:'flex',alignItems:'stretch',gap:6}}>
                <button type="button" className="btn btn-ghost btn-sm" style={{width:34}} onClick={()=>setPots(f.pots-1)} disabled={f.pots<=1} aria-label="Restar bote">−</button>
                <input className="field-input" style={{textAlign:'center'}} type="number" min="1" max="12" value={f.pots} onChange={e=>setPots(e.target.value)}/>
                <button type="button" className="btn btn-ghost btn-sm" style={{width:34}} onClick={()=>setPots(f.pots+1)} disabled={f.pots>=12} aria-label="Sumar bote">+</button>
              </div>
            </div>
            <div className="field">
              <label className="field-label">Especialidad</label>
              <input className="field-input" list="specs-dl" placeholder="Escribe o elige una especialidad…" value={f.spec} onChange={e=>set('spec',e.target.value)}/>
              <datalist id="specs-dl">{Object.keys(specialties).map(sp=><option key={sp} value={sp}/>)}</datalist>
              {isNewSpec && <div className="field-note new">Especialidad nueva: se añadirá al laboratorio.</div>}
            </div>

            <div className="field full">
              <label className="field-label">Descripción de la muestra (opcional)</label>
              <input className="field-input" placeholder="p. ej. Biopsia cutánea — lesión melanocítica" value={f.type} onChange={e=>set('type',e.target.value)} autoFocus/>
            </div>

            <div className="field full">
              <label className="field-label">Paciente *</label>
              <input className="field-input" placeholder="Apellidos, Nombre" value={f.patient} onChange={e=>set('patient',e.target.value)}/>
            </div>
            <div className="field">
              <label className="field-label">Nº historia clínica (opcional)</label>
              <input className="field-input" value={f.historyNumber} onChange={e=>set('historyNumber',e.target.value)}/>
            </div>
            <div className="field">
              <label className="field-label">Fecha de nacimiento (opcional)</label>
              <input className="field-input" type="date" value={f.birthDate} onChange={e=>set('birthDate',e.target.value)}/>
            </div>
            <div className="field" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
              <div><label className="field-label">Edad (opcional)</label><input className="field-input" type="number" placeholder="55" value={f.age} onChange={e=>set('age',e.target.value)}/></div>
              <div><label className="field-label">Sexo</label>
                <select className="field-input" value={f.sex} onChange={e=>set('sex',e.target.value)}><option value="M">Mujer</option><option value="H">Hombre</option></select>
              </div>
            </div>

            <div className="field full" style={{marginBottom:0}}>
              <label style={{display:'flex',alignItems:'center',gap:9,cursor:'pointer',fontSize:13,fontWeight:500}}>
                <input type="checkbox" checked={f.urgent} onChange={e=>set('urgent',e.target.checked)} style={{width:16,height:16,accentColor:'var(--red)'}}/>
                Marcar como <strong style={{color:'var(--red)'}}>URGENTE</strong> (prioridad diagnóstica)
              </label>
            </div>
          </div>
        </div>
        <div className="modal-foot">
          <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={submit} disabled={!valid}>Registrar {previewCode}</button>
        </div>
      </div>
    </div>
    </Portal>
  );
}

/* ════════════════ ETIQUETAS (TALLADO) ════════════════ */
// Imprime dos etiquetas por bote recibido (bote + hoja de petición), con QR
// generado en el propio navegador — igual que hace la técnica en el
// laboratorio: selecciona lo que ha llegado y le da a imprimir, de golpe.
// Impresión directa: sin pasar por la pantalla de selección, para cuando ya
// sabes exactamente qué etiquetas quieres (una muestra concreta). Se monta,
// imprime y desaparece sola.
function QuickPrintLabels({ labels, onDone }) {
  useEffect(() => {
    const t = setTimeout(() => { window.print(); onDone(); }, 60);
    return () => clearTimeout(t);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);
  return (
    <Portal>
      <div className="print-area label-sheet">
        {labels.map((l,i)=>(
          <div className="label-box" key={i}>
            <img src={qrDataUrl(l.code)} alt={`QR ${l.code}`}/>
            <div>
              <div className="label-kind">{l.kind}</div>
              <div className="label-code">{l.code}</div>
              <div className="label-meta">{l.patient}<br/>{l.received}</div>
            </div>
          </div>
        ))}
      </div>
    </Portal>
  );
}

function LabelsModal({ candidates, onClose, markPrinted }) {
  const [ids, setIds] = useState(() => candidates.map(s=>s.id));
  const toggle = (id) => setIds(prev => prev.includes(id) ? prev.filter(x=>x!==id) : [...prev, id]);
  const selected = candidates.filter(s=>ids.includes(s.id));
  const labels = selected.flatMap(labelsForSample);

  const print = () => {
    if (!ids.length) return;
    markPrinted(ids);
    setTimeout(() => { window.print(); onClose(); }, 50);
  };

  return (
    <Portal>
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget && onClose()}>
      <div className="modal" style={{width:640}}>
        <div className="modal-head">
          <h3>{GL.tag} Imprimir etiquetas</h3>
          <p>Una etiqueta por bote y una por hoja de petición, con QR del código de caso — pégalas en el pote y en la hoja.</p>
        </div>
        <div className="modal-body">
          <div className="section-title" style={{marginTop:0}}>Muestras pendientes de etiquetar ({candidates.length})</div>
          <div className="card" style={{marginBottom:16}}>

              <label key={s.id} className="label-check-row" style={{cursor:'pointer',padding:'8px 12px'}}>

                <span className="mono" style={{fontWeight:600}}>{s.caseCode}</span>

                <span style={{color:'var(--text-3)',marginLeft:'auto',fontSize:12}}>{s.pots} bote{s.pots!==1?'s':''} · {s.pots+1} etiquetas</span>
              </label>
            ))}
          </div>

          {labels.length>0 && (
            <>
              <div className="section-title">Vista previa ({labels.length} etiquetas)</div>
              <div className="print-area label-sheet">
                {labels.map((l,i)=>(
                  <div className="label-box" key={i}>
                    <img src={qrDataUrl(l.code)} alt={`QR ${l.code}`}/>
                    <div>
                      <div className="label-kind">{l.kind}</div>
                      <div className="label-code">{l.code}</div>
                      <div className="label-meta">{l.patient}<br/>{l.received}</div>
                    </div>
                  </div>

            </>
          )}
        </div>
        <div className="modal-foot">
          <button className="btn btn-ghost" onClick={onClose}>Cerrar</button>
          <button className="btn btn-primary" onClick={print} disabled={!ids.length}>{I.plus} Imprimir {labels.length} etiquetas</button>
        </div>
      </div>
    </div>
    </Portal>
  );
}

/* ════════════════ CHAT ════════════════ */
function Chat({ apiKey, aiLive, onAiResult, samples }) {
  const [activeDoc, setActiveDoc] = useState(DOCS[1]);
  const [uploaded, setUploaded] = useState([]);
  const [messages, setMessages] = useState([{
    role:'assistant',
    content:`Hola, soy **LabAI**, el asistente clínico del laboratorio. Esta demo muestra un catálogo de protocolos, cuyo contenido no está conectado al asistente. Puedo consultar el estado de las **${samples.length} muestras** activas.\n\nPuedo ayudarte con criterios diagnósticos, codificación SNOMED CT, protocolos técnicos y trazabilidad. Prueba una de las preguntas sugeridas de abajo 👇 o escribe la tuya. ¿Qué necesitas consultar?`,
    sources:[]
  }]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const endRef = useRef(null);
  const fileRef = useRef(null);

  useEffect(()=>{ endRef.current?.scrollIntoView({behavior:'smooth'}); }, [messages, loading]);

  const SUGGESTS = [
    '¿Qué índice de Breslow define un melanoma de alto riesgo?',
    'Resume los criterios de Bethesda para citología cervical',
    'Código SNOMED del carcinoma ductal infiltrante de mama',
    '¿Cuántas muestras urgentes hay pendientes ahora?',
  ];

  const send = async (text) => {
    const q = (text ?? input).trim();
    if (!q || loading) return;

    const newMsgs = [...messages, { role:'user', content:q, sources:[] }];
    setMessages(newMsgs);
    setInput('');
    setLoading(true);

    // Sin IA real disponible (o ya sabemos que no responde) → modo demostración
    if (!aiLive) {
      await sleep(700 + Math.random()*700);
      const reply = simulateChatReply(q, samples);
      const sources = [];
      setMessages(m=>[...m, { role:'assistant', content:'[SIMULACIÓN: respuesta de demostración]\n\n'+reply, sources }]);
      setLoading(false);
      return;
    }

    const urgentList = samples.filter(s=>s.urgent && s.state!=='validado').map(s=>`${s.id} (${s.type}, ${s.patient})`).join('; ');
    const ctx = `\n\n[CONTEXTO EN VIVO]\nDocumento activo en consulta: "${activeDoc.name}" (${activeDoc.tipo}, ${activeDoc.pages} págs).${uploaded.length?` Documentos subidos: ${uploaded.map(d=>d.name).join(', ')}.`:''}\nMuestras activas: ${samples.length}. Urgentes pendientes: ${urgentList||'ninguna'}.`;

    try {
      const reply = await aiComplete(apiKey, {
        temperature:0.4, max_tokens:850,
        messages:[
          { role:'system', content: SYS_PROMPT + ctx },
          ...messages.filter(m=>m.role!=='system').map(m=>({role:m.role,content:m.content})),
          { role:'user', content:q }
        ]
      });
      const sources = [];
      setMessages(m=>[...m, { role:'assistant', content:reply || 'No se obtuvo respuesta.', sources }]);
      onAiResult && onAiResult(true);
    } catch(e) {
      // Si la IA real falla, caemos al modo demostración para que nunca parezca roto,
      // pero avisamos al resto de la app de que el motor de IA no está respondiendo.
      const reply = simulateChatReply(q, samples);
      setMessages(m=>[...m, { role:'assistant', content:'[SIMULACIÓN: el motor de IA no está disponible]\n\n'+reply, sources:[] }]);
      onAiResult && onAiResult(false);
    }
    setLoading(false);
  };

  const onFile = (e) => {
    const f = e.target.files[0]; if (!f) return;
    setUploaded(u=>[...u, f]);
    setMessages(m=>[...m, { role:'assistant', content:`Has seleccionado **${f.name}** (${(f.size/1024).toFixed(0)} KB). Esta demo no extrae ni indexa su contenido; el asistente no puede leerlo.`, sources:[] }]);
    e.target.value='';
  };

  return (
    <div className="card" style={{height:'100%',padding:0,display:'flex',overflow:'hidden'}}>
      <div className="chat-wrap">
        <div className="chat-docs">
          <div className="chat-docs-head"><h3>Base de conocimiento</h3><p>Catálogo de demostración · contenido no conectado</p></div>
          <div className="doc-list">
            {DOCS.map(d=>(
              <button key={d.id} className={`doc-item${activeDoc.id===d.id?' active':''}`} onClick={()=>setActiveDoc(d)}>
                <div className="doc-item-top"><span className="doc-item-ico">{d.ico}</span><span className="doc-item-name">{d.name}</span></div>
                <div className="doc-item-meta">{d.tipo} · {d.pages} págs · {d.date}</div>
              </button>
            ))}
            {uploaded.map((d,i)=>(
              <div key={'u'+i} className="doc-item active">
                <div className="doc-item-top"><span className="doc-item-ico">{GL.paperclip}</span><span className="doc-item-name">{d.name}</span></div>
                <div className="doc-item-meta">Subido · {(d.size/1024).toFixed(0)} KB</div>
              </div>
            ))}
          </div>
          <div className="doc-upload">
            <input ref={fileRef} type="file" accept=".pdf,.txt,.docx,.png,.jpg" style={{display:'none'}} onChange={onFile}/>
            <button className="btn btn-ghost" style={{width:'100%'}} onClick={()=>fileRef.current?.click()}>{I.upload} Subir documento</button>
          </div>
        </div>

        <div className="chat-panel">
          <div className="chat-ctx">
            <span>Contexto:</span>
            <span className="ctx-tag">{I.doc} {activeDoc.name}</span>
            {uploaded.length>0 && <span className="ctx-tag">+{uploaded.length} subido{uploaded.length>1?'s':''}</span>}
            {!aiLive && <span style={{marginLeft:'auto',color:'var(--brand-700)',fontWeight:600,fontSize:11.5,background:'var(--brand-50)',padding:'3px 10px',borderRadius:99}}>● Modo demostración</span>}
          </div>
          <div className="chat-msgs">
            {messages.map((m,i)=>(
              <div className={`msg ${m.role==='user'?'user':'ai'}`} key={i}>
                <div className="msg-av">{m.role==='user'?'MV':GL.cpu}</div>
                <div className="msg-body">
                  <div className="msg-bubble"><FormatText text={m.content}/></div>
                  {m.sources?.length>0 && (
                    <div className="msg-sources">
                      <span style={{fontSize:11,color:'var(--text-3)',alignSelf:'center'}}>Fuente:</span>
                      {m.sources.map((s,j)=>(
                        <span className="src-chip" key={j}>{I.doc} {s.name} {s.page && <span className="src-page">p.{s.page}</span>}</span>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            ))}
            {loading && (
              <div className="msg ai"><div className="msg-av">{GL.cpu}</div><div className="msg-body"><div className="msg-bubble"><div className="typing"><span></span><span></span><span></span></div></div></div></div>
            )}
            <div ref={endRef}/>
          </div>
          <div className="chat-input-wrap">
            <div className="suggest-row">
              {SUGGESTS.map((s,i)=><button key={i} className="suggest-chip" onClick={()=>send(s)}>{s}</button>)}
            </div>
            <div className="input-box">
              <textarea rows={1} placeholder={'Escribe tu consulta clínica...'}
                value={input} onChange={e=>setInput(e.target.value)}
                onKeyDown={e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } }}/>
              <button className="send-btn" onClick={()=>send()} disabled={loading||!input.trim()}>{loading?<span className="spinner"></span>:I.send}</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function FormatText({ text }) {
  const html = text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/`(.+?)`/g,'<code>$1</code>')
    .replace(/\n/g,'<br/>');
  return <span dangerouslySetInnerHTML={{__html:html}}/>;
}

/* ════════════════ REPORTS ════════════════ */
function Reports({ apiKey, aiLive, onAiResult, samples, specialties, showToast, initialSampleId }) {
  const validatable = samples;
  const [sampleId, setSampleId] = useState(initialSampleId || samples.find(s=>s.state==='diagnostico')?.id || samples[0]?.id);
  // Si se llega aquí pulsando "Informe" desde otra muestra (con la vista de Informes
  // ya montada), initialSampleId cambia pero useState no lo vuelve a leer: hay que
  // sincronizar explícitamente o se queda siempre en la primera muestra seleccionada.
  useEffect(() => {
    if (initialSampleId) setSampleId(initialSampleId);
  }, [initialSampleId]);
  const sample = samples.find(s=>s.id===sampleId) || samples[0];
  const [spec, setSpec] = useState(sample?.spec || Object.keys(specialties)[0]);
  const [template, setTemplate] = useState('');
  const [macro, setMacro] = useState('');
  const [micro, setMicro] = useState('');
  const [report, setReport] = useState('');
  const [gen, setGen] = useState(false);

  useEffect(()=>{
    if (sample) {
      setSpec(sample.spec);
      // Si el caso ya trae descripción macroscópica (paso de Inclusión) o
      // diagnóstico (paso de Diagnóstico) reales, se arranca con eso en vez
      // de un texto de relleno. Los hallazgos ausentes permanecen vacíos.
      const knownTemplate = templatesFor(sample.spec).find(t =>
        (sample.diagnosisText||'').toLowerCase().includes(t.toLowerCase())
      );
      setTemplate(knownTemplate || sample.diagnosisText?.trim() || '');
      setMacro(sample.desc?.trim() || '');
      setMicro(sample.diagnosisText?.trim() || '');
      setReport('');
    }
  }, [sampleId]);

  const generate = async () => {
    if (gen || !sample || !macro.trim() || !micro.trim()) return;
    setGen(true); setReport('');
    // Sin IA real disponible (o ya sabemos que no responde) → informe simulado
    if (!aiLive) {
      await sleep(1100 + Math.random()*600);
      setReport('SIMULACIÓN — BORRADOR DE DEMOSTRACIÓN, NO VALIDADO\n\n'+simulateReport(sample, spec, template, macro, micro));
      setGen(false);
      return;
    }
    const prompt = `Redacta un INFORME ANATOMOPATOLÓGICO profesional y completo en español, listo para validar, con esta estructura exacta usando los encabezados en MAYÚSCULAS:

DATOS DE LA MUESTRA
DESCRIPCIÓN MACROSCÓPICA
DESCRIPCIÓN MICROSCÓPICA
DIAGNÓSTICO
CODIFICACIÓN SNOMED CT
COMENTARIO / RECOMENDACIONES

Datos:
- Laboratorio: BCN Patòlegs (Barcelona)
- Referencia: ${sample.id}
- Paciente: ${sample.patient}, ${sample.age} años, ${sample.sex==='M'?'mujer':'hombre'}
- Tipo de muestra: ${sample.type}
- Especialidad: ${spec}
- Orientación diagnóstica (plantilla): ${template}
- Hallazgos macroscópicos del patólogo: ${macro}
- Hallazgos microscópicos del patólogo: ${micro}
- Codificación SNOMED: no se ha proporcionado un código verificado. Escribe [PENDIENTE: codificación por el patólogo]; no lo deduzcas de la especialidad.

Usa terminología anatomopatológica rigurosa. En DIAGNÓSTICO sé conciso y categórico. Incluye gradación o estadificación si procede (Breslow/Clark en melanoma, grado de Nottingham en mama, sistema Bethesda en citología, grado de displasia en digestivo). No inventes datos no proporcionados; si falta algún dato relevante para completar, indícalo como [PENDIENTE: ...].`;

    try {
      const out = await aiComplete(apiKey, { temperature:0.3, max_tokens:1100, messages:[
        { role:'system', content:'Eres un médico especialista en anatomía patológica del laboratorio BCN Patòlegs. Redactas informes diagnósticos profesionales, estructurados y rigurosos en español.' },
        { role:'user', content:prompt }
      ]});
      setReport(out || simulateReport(sample, spec, template, macro, micro));
      onAiResult && onAiResult(true);
    } catch(e) {
      // Si la IA real falla, usamos el borrador simulado para que nunca quede en blanco,
      // pero avisamos al resto de la app de que el motor de IA no está respondiendo.
      setReport('SIMULACIÓN — BORRADOR DE DEMOSTRACIÓN, NO VALIDADO\n\n'+simulateReport(sample, spec, template, macro, micro));
      onAiResult && onAiResult(false);
    }
    setGen(false);
  };

  const exportTxt = () => {
    const blob = new Blob([`BCN PATÒLEGS — BORRADOR NO VALIDADO\nReferencia: ${sample.caseCode}\n\n${report}`], {type:'text/plain'});
    const u = URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=`${sample.caseCode}_informe.txt`; a.click();
    setTimeout(()=>URL.revokeObjectURL(u),1000);
    showToast('Informe exportado');
  };

  return (
    <div className="report-cols">
      <div className="card" style={{display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <div className="card-head"><h3>{I.report} Datos del informe</h3></div>
        <fieldset className="report-form-body" disabled={gen} style={{border:0,margin:0,minWidth:0}}>
          <div className="field">
            <label className="field-label">Muestra</label>
            <select className="field-input" value={sampleId} onChange={e=>setSampleId(e.target.value)}>
              {validatable.map(s=><option key={s.id} value={s.id}>{s.caseCode} — {s.type.slice(0,42)}</option>)}
            </select>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            <div className="field">
              <label className="field-label">Especialidad</label>
              <select className="field-input" value={spec} onChange={e=>{setSpec(e.target.value); setTemplate('');}}>
                {Object.keys(specialties).map(sp=><option key={sp}>{sp}</option>)}
              </select>
            </div>
            <div className="field">
              <label className="field-label">Orientación diagnóstica</label>
              <input className="field-input" list="templates-dl" placeholder="Escribe el diagnóstico orientativo…" value={template} onChange={e=>setTemplate(e.target.value)}/>
              <datalist id="templates-dl">{templatesFor(spec).map(t=><option key={t} value={t}/>)}</datalist>
            </div>
          </div>
          <div className="field">
            <label className="field-label">Descripción macroscópica</label>
            <textarea className="field-input" value={macro} onChange={e=>setMacro(e.target.value)} rows={3}/>
          </div>
          <div className="field">
            <label className="field-label">Descripción microscópica / hallazgos</label>
            <textarea className="field-input" value={micro} onChange={e=>setMicro(e.target.value)} rows={5}/>
          </div>
          <button className="btn btn-primary" style={{width:'100%'}} onClick={generate} disabled={gen || !macro.trim() || !micro.trim()}>
            {gen ? <><span className="spinner"></span> Redactando informe...</> : <>{I.ai} Generar informe con IA</>}
          </button>
          <p style={{fontSize:11.5,color:'var(--text-3)',marginTop:10,lineHeight:1.5,textAlign:'center'}}>
            {(!macro.trim() || !micro.trim())
              ? 'Completa la descripción macroscópica y microscópica para poder generar el informe.'
              : 'La IA redacta el borrador. El patólogo revisa, ajusta y valida antes de firmar.'}
          </p>
        </fieldset>
      </div>

      <div className="card report-doc">
        <div className="card-head">
          <h3>{I.micro} Vista previa del informe</h3>
          <div className="card-actions">
            {report && <><button className="btn btn-ghost btn-sm" onClick={()=>window.print()}>{I.print} Imprimir</button>
            <button className="btn btn-soft btn-sm" onClick={exportTxt}>{I.download} Exportar</button></>}
          </div>
        </div>
        <div className="report-paper print-area">
          <p style={{fontWeight:700}}>BORRADOR NO VALIDADO · Requiere revisión del patólogo</p>
          <div className="rp-letterhead">
            <div className="rp-lab">
              <div className="rp-lab-mark"><img src={LOGO_SRC} alt="BCN Patòlegs"/></div>
              <div>
                <div className="rp-lab-name">BCN Patòlegs</div>
                <div className="rp-lab-sub">Laboratori d'Anatomia Patològica · Barcelona</div>
              </div>
            </div>
            <div className="rp-ref">
              <div><strong>Ref:</strong> {sample.caseCode}</div>
              <div><strong>Fecha:</strong> {new Date().toLocaleDateString('es-ES')}</div>
              <div><strong>Patólogo:</strong> {sample.tech}</div>
            </div>
          </div>
          {report ? <ReportRender text={report}/> : (
            <div className="rp-placeholder">
              {gen ? <><span className="spinner dark"></span><div style={{marginTop:12}}>Redactando informe anatomopatológico con IA…</div></>
                   : <>Completa los hallazgos y pulsa<br/><strong>«Generar informe con IA»</strong><br/>para crear el informe completo.</>}
            </div>
          )}
          {report && (
            <div className="rp-sign">
              <div>Dr./Dra. ________________________<br/><span style={{fontSize:10.5}}>Firma y nº de colegiado</span></div>
              <div style={{textAlign:'right'}}>{sample.tech}<br/><span style={{fontSize:10.5}}>Anatomía Patológica</span></div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function ReportRender({ text }) {
  const lines = text.split('\n');
  const HEADERS = ['DATOS DE LA MUESTRA','DESCRIPCIÓN MACROSCÓPICA','DESCRIPCIÓN MICROSCÓPICA','DIAGNÓSTICO','CODIFICACIÓN SNOMED CT','COMENTARIO / RECOMENDACIONES','COMENTARIO','RECOMENDACIONES'];
  return (
    <div className="rp-content">
      {lines.map((ln,i)=>{
        const trimmed = ln.trim().replace(/[:：]$/,'').replace(/\*\*/g,'');
        if (HEADERS.some(h=>trimmed.toUpperCase()===h)) return <h4 key={i}>{trimmed}</h4>;
        const html = ln.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
        return <span key={i} dangerouslySetInnerHTML={{__html: html + (i<lines.length-1?'\n':'')}}/>;
      })}
    </div>
  );
}
